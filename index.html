<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AFOQT Pilot Trainer</title>
<meta name="description" content="Practice and timed simulation for every AFOQT subtest.">
<meta name="theme-color" content="#ECEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1520" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AFOQT">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format('woff2')}
</style>

<style>
/* Layout: one-column instrument-panel app; home list of subtests, full-height drill screen */
:root{
  --bg:#ECEFF3; --panel:#FFFFFF; --ink:#142030; --muted:#5B6878; --line:#CDD5DE;
  --accent:#C9741C; --accent-soft:#F6E3CC; --good:#23824F; --good-soft:#DCEFE3; --bad:#B93A33; --bad-soft:#F6DEDC;
  --sky:#8DB9E2; --sky-soft:#DCE9F5; --ic-sky:#B4CFEA; --ground:#8B6A49;
  --plane-top:#FBFCFD; --plane-bot:#6E7B8A; --plane-body:#C9D1DA; --plane-edge:#3B4756; --glass:#1E2A38;
  --bc-top:#F3F5F8; --bc-x:#C9D1DA; --bc-y:#A9B4C1; --bc-edge:#2A3442; --bc-t-top:#F6C894; --bc-t-x:#E09A4E; --bc-t-y:#C27A30; --bc-n-top:#B9E3C9; --bc-n-x:#7CC49A; --bc-n-y:#4FA373;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1520; --panel:#172230; --ink:#E5EBF1; --muted:#93A1B1; --line:#2A3746;
  --accent:#EE9F4C; --accent-soft:#3A2A18; --good:#4CC086; --good-soft:#163526; --bad:#E86A61; --bad-soft:#3D1D1B;
  --sky:#3B6C9C; --sky-soft:#1C2E42; --ic-sky:#25405D; --ground:#6A4D31;
  --plane-top:#E6EBF0; --plane-bot:#6F7C8A; --plane-body:#B5BFCA; --plane-edge:#0E1520; --glass:#0B121A; --bc-top:#C9D1DA; --bc-x:#8C98A6; --bc-y:#6B7785; --bc-edge:#0B1118; --bc-t-top:#F2B36E; --bc-t-x:#D08A3F; --bc-t-y:#A86A28; --bc-n-top:#8ED3AA; --bc-n-x:#5BB283; --bc-n-y:#3E8E62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1520; --panel:#172230; --ink:#E5EBF1; --muted:#93A1B1; --line:#2A3746;
  --accent:#EE9F4C; --accent-soft:#3A2A18; --good:#4CC086; --good-soft:#163526; --bad:#E86A61; --bad-soft:#3D1D1B;
  --sky:#3B6C9C; --sky-soft:#1C2E42; --ic-sky:#25405D; --ground:#6A4D31;
  --plane-top:#E6EBF0; --plane-bot:#6F7C8A; --plane-body:#B5BFCA; --plane-edge:#0E1520; --glass:#0B121A; --bc-top:#C9D1DA; --bc-x:#8C98A6; --bc-y:#6B7785; --bc-edge:#0B1118; --bc-t-top:#F2B36E; --bc-t-x:#D08A3F; --bc-t-y:#A86A28; --bc-n-top:#8ED3AA; --bc-n-x:#5BB283; --bc-n-y:#3E8E62; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:34px;line-height:1.05}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#1A1006}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#1A1006}}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* home */
.mast{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.mast p{margin:0;color:var(--muted);max-width:60ch}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.summary{grid-template-columns:1fr 1fr}.summary .tile:last-child{grid-column:1 / -1}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.tile .big{font-family:var(--display);font-size:30px;font-weight:600;line-height:1}
.tile input{font:inherit;font-family:var(--mono);font-size:14px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px;max-width:100%}
.feature{background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.feature h3{font-size:24px}
.group{display:flex;flex-direction:column;gap:10px}
.sub{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sub .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sub h3{font-size:22px;line-height:1.1}
.spec{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stats{font-size:14px;color:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.pill.ready{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.pill.building{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.note{font-size:14px;color:var(--muted);margin:0}
.foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}

/* lesson */
.lesson{display:flex;flex-direction:column;gap:14px;max-width:65ch}
.lesson h3{font-size:22px;margin-top:6px}
.lesson p,.lesson li{margin:0}
.lesson ul,.lesson ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.box.trap{border-color:var(--bad)}
.box .label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}

/* session: fills the screen, nothing scrolls while answering */
html{box-sizing:border-box}
body.in-session{overflow:hidden}
body.in-session #app{height:100%}
.session{max-width:720px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:8px;padding-block:0 8px}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px 8px;border-bottom:1px solid var(--line);flex:none}
.bar .title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.bar .title b{font-family:var(--display);font-size:clamp(16px,4.8vw,20px);font-weight:600;line-height:1.05;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.bar .title span{font-family:var(--mono);font-size:clamp(10.5px,3.1vw,12px);color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
@media (max-width:400px){.bar{gap:6px}.bar .btn.small{padding-inline:10px}.timer{font-size:16px;padding:3px 6px}}
.timer{font-family:var(--mono);font-size:18px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.rules{flex:none;font-size:13px;color:var(--muted)}
.rules summary{list-style:none;cursor:pointer;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rules summary::-webkit-details-marker{display:none}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;color:var(--ink);background:var(--panel);white-space:nowrap}
.chip.no{border-color:var(--bad);color:var(--bad)}
.chip.yes{border-color:var(--good);color:var(--good)}
.rules .more{font-size:12px;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.rules[open] .more{display:none}
.rulesbody{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:6px;max-height:42dvh;overflow:auto;display:flex;flex-direction:column;gap:8px;color:var(--ink);font-size:14px}
.rulesbody ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.rulesbody p{margin:0}
.warn{flex:none;background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px}
.qarea{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:auto}
.qarea.fill{overflow:hidden}
.tag{align-self:flex-start;flex:none;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 9px}
.stem{flex:none;font-size:18px;line-height:1.45}
.stem .coord{font-family:var(--mono);font-size:22px;font-weight:600}
.stem .ask{font-size:16px;margin-top:6px}
.opts{display:grid;gap:8px;flex:none}
.opt{position:relative;display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:48px;transition:transform .08s}
.opt:active{transform:scale(.985)}
.opt .key{font-family:var(--mono);font-weight:600;font-size:14px;width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:6px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.opt .val{min-width:0;font-size:17px}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.sel .key{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .key{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:#fff;border-color:var(--bad)}
.opts.tr{grid-template-columns:repeat(5,1fr)}
.opts.tr .opt{flex-direction:column;gap:4px;padding:6px 4px;align-items:center;text-align:center}
.opts.tr .opt .val{font-family:var(--mono);font-size:19px;font-weight:600}
.opts.pics{flex:1;min-height:0;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.opts.pics .opt{min-height:0;padding:4px;display:flex}
.opts.pics .opt .key{position:absolute;top:6px;left:6px;z-index:1}
.opts.pics .opt .val{flex:1;min-height:0;height:100%;display:flex}
.opts.pics svg{width:100%;height:100%;display:block;border-radius:6px}
.dials{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:min(23dvh,190px)}
.dial{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:0}
.dial svg{flex:1;min-height:0;width:100%;height:100%}
.dial span{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
@media (orientation:landscape) and (max-height:560px){.opts.pics{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr}.dials{height:30dvh}}
.hint{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:15px}
.nav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;flex:none}
.sheet-spacer{flex:none;height:64px}
/* explanation sheet slides over the bottom of the screen */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:752px;margin:0 auto;max-height:64dvh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex:none}
.sheet .verdict{font-family:var(--display);font-size:22px;font-weight:600}
.sheet .verdict.ok{color:var(--good)} .sheet .verdict.no{color:var(--bad)}
.sheet-body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;font-size:15px;padding-block:8px}
.sheet.folded .sheet-body{display:none}
.sheet .sec{display:flex;flex-direction:column;gap:4px}
.sheet .sec>b{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.sheet .yours{border-left:3px solid var(--bad);padding-left:10px}
.sheet ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.sheet details summary{cursor:pointer;font-weight:600}
.sheet details ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.sheet-foot{flex:none;padding-top:8px}
.sheet-foot .btn{width:100%}
.pace{font-family:var(--mono);font-size:13px;color:var(--muted)}
.pace.slow{color:var(--bad)}

/* table reading */
.tablebox{flex:1;min-height:110px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table.grid{border-collapse:collapse;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
table.grid th,table.grid td{padding:3px 4px;text-align:center;min-width:24px;border-right:1px solid var(--line)}
table.grid tr:nth-child(5n+1) td{border-bottom:1px solid var(--line)}
table.grid thead th{position:sticky;top:0;background:var(--accent-soft);z-index:2;font-weight:600}
table.grid tbody th{position:sticky;left:0;background:var(--accent-soft);z-index:1;font-weight:600}
table.grid thead th.corner{left:0;z-index:3;font-size:10px}
table.grid td.hit{background:var(--good);color:#fff;font-weight:600}

/* analytics */
.chart{width:100%;height:auto;display:block}
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.cg{stroke:var(--line);stroke-width:1}
.ct{fill:var(--muted);font-family:var(--mono);font-size:12px}
.ct.strong{fill:var(--ink);font-weight:600;font-size:13px}
.ct.good{fill:var(--good)}
.ctarget{stroke:var(--good);stroke-dasharray:5 4;stroke-width:1.25}
.cline{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.cdot{fill:var(--panel);stroke:var(--accent);stroke-width:2}
.cdot.last{fill:var(--accent)}
.cbar{fill:var(--accent)}
.cbar.empty{fill:var(--line)}
.topics{display:flex;flex-direction:column;gap:8px}
.topic{display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,110px) 44px auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.topic .tname{min-width:0;font-size:15px;font-weight:600}
.topic .tname span{display:block;font-family:var(--mono);font-size:12px;font-weight:400;color:var(--muted)}
.tbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent)}
.tbar i.good{background:var(--good)} .tbar i.bad{background:var(--bad)}
.topic .num{text-align:right;font-size:14px}
.history{display:flex;gap:6px;flex-wrap:wrap}

/* results */
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .big{font-family:var(--display);font-size:64px;font-weight:700;line-height:1}
.miss{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.miss .q{font-weight:600}
.miss .a{font-family:var(--mono);font-size:13px;color:var(--muted)}
.miss ol{margin:0;padding-left:20px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:15px}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tbl td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
details.sect{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
details.sect summary{cursor:pointer;font-weight:600}
details.sect .miss{border:none;padding:8px 0;border-top:1px solid var(--line);border-radius:0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.secinfo{display:flex;gap:24px;flex-wrap:wrap}
/* v4: navigation, home rows, hub, progress, explanation */
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:none;background:none;padding:4px 0;font-weight:600;font-size:15px;color:var(--accent)}
.back::before{content:"";width:8px;height:8px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-left:2px}
.topline{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.statusbar{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.statusbar>div{padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.statusbar>div+div{border-left:1px solid var(--line)}
.statusbar .label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.statusbar .big{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.05}
.statusbar .note{font-size:12px}
.today{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 0 3px var(--accent-soft)}
.today h3{font-size:26px}
.srows{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto 12px;align-items:center;gap:12px;padding:12px 14px;border:none;background:none;text-align:left;width:100%}
.srow+.srow{border-top:1px solid var(--line)}
.srow:active{background:var(--bg)}

<script>
/* ================= helpers ================= */
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const M='−';
const neg=n=>n<0?M+Math.abs(n):String(n);
const fmtN=n=>{const r=Math.round(n*100)/100;return neg(r).replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'')};
const money=n=>{const r=Math.round(n*100)/100;return '$'+r.toLocaleString('en-US',{minimumFractionDigits:Number.isInteger(r)?0:2,maximumFractionDigits:2})};
const frac=(n,d)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;n/=g;d/=g;return d===1?neg(n):neg(n)+'/'+d};
const hm=m=>{const h=Math.floor(m/60),r=m%60;return h?(r?`${h} h ${r} min`:`${h} h`):`${r} min`};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const strip=s=>String(s).replace(/<[^>]*>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
const L='ABCDE';
const CLOSE='Close to the right answer, but not exact. Redo the arithmetic step by step.';

/* Question builder. wrongs: string or [string, reason]. */
function Q(stem,correct,wrongs,explain,n=5,extra={}){
  const seen=new Set([strip(correct)]);const ws=[];
  for(const w of wrongs){const [v,why]=Array.isArray(w)?w:[w,null];const k=strip(v);if(!seen.has(k)){seen.add(k);ws.push([v,why])}if(ws.length>=n-1)break}
  if(ws.length<n-1)return null;
  const all=shuffle([[correct,null],...ws]);
  return Object.assign({stem,options:all.map(x=>x[0]),why:all.map(x=>x[1]),answer:all.findIndex(x=>x[0]===correct),explain},extra);
}
/* numeric version: wrongs are numbers or [number, reason] */
function numQ(stem,ans,wrongs,fmt,explain,n=5){
  const fill=[ans*1.1,ans*0.9,ans*1.2,ans*0.8,ans+1,ans-1,ans*1.5,ans*0.5].map(v=>[v,CLOSE]);
  const ws=[...wrongs.map(w=>Array.isArray(w)?w:[w,CLOSE]),...fill].filter(([v])=>v>0&&Math.abs(v-ans)>1e-9).map(([v,why])=>[fmt(v),why]);

}
const T=(tag,tip,f)=>({tag,tip,f});
const steps=a=>'<ol>'+a.map(s=>`<li>${s}</li>`).join('')+'</ol>';

/* ================= Arithmetic Reasoning ================= */
const AR=[
T('ar-dist','Distance = speed × time. Convert minutes to hours first by dividing by 60: 15 min = 0.25 h, 30 min = 0.5 h, 45 min = 0.75 h.',()=>{const s=pick([120,140,160,180,220,240,300,360,420,480]),h=rand(1,4),m=pick([15,30,45]);const d=s*(h+m/60);
 return numQ(`An aircraft cruises at ${s} knots for ${h} hour${h>1?'s':''} and ${m} minutes. How many nautical miles does it cover?`,d,
 [[s*h,`Uses only the ${h} whole hours and forgets the ${m} minutes.`],[s*(h+m/100),`Treats ${m} minutes as 0.${m} hours. Minutes must be divided by 60, so ${m} min = ${m/60} h.`],[s*(h+1),'Rounds the time up to a full extra hour.'],[d+s/2,'Adds an extra half hour that isn’t in the question.']],

 const ws=[];if(t%60){ws.push([hm(Math.floor(t/60)*60+Math.round((t%60)/60*100)),`Reads ${fmtN(t/60)} h as ${Math.floor(t/60)} h ${Math.round((t%60)/60*100)} min. The decimal is a fraction of an hour: ${fmtN((t%60)/60)} × 60 = ${t%60} min.`])}
 ws.push([hm(t+15),'15 minutes too long. Recheck the division.']);if(t>15)ws.push([hm(t-15),'15 minutes too short. Recheck the division.']);ws.push([hm(t+30),'30 minutes too long.']);ws.push([hm(t+45),'45 minutes too long. Recheck the division.']);if(t>30)ws.push([hm(t-30),'30 minutes too short.']);
 return Q(`A flight of ${d} nautical miles is flown at a groundspeed of ${s} knots. How long does it take?`,hm(t),ws,

T('ar-fuel','Fuel used = burn rate (per hour) × time in hours. Turn minutes into hours by dividing by 60.',()=>{const g=rand(8,16),t=pick([45,75,90,105,135,150,165]);const f=g*t/60;

T('ar-work','Working together, rates add. Each worker does 1/time of the job per hour. Shortcut for two: together = (a × b) ÷ (a + b). The answer is always faster than the faster worker.',()=>{const [a,b,ans]=pick([[3,6,2],[4,12,3],[6,12,4],[2,6,1.5],[10,15,6],[12,24,8],[4,4,2],[6,3,2],[5,20,4],[9,18,6]]);
 return numQ(`One crew can refuel the flight line's aircraft in ${a} hours; a second crew takes ${b} hours. Working together, how long will it take?`,ans,
 [[(a+b)/2,'Averages the two times. Two crews together must be faster than either crew alone.'],[a+b,'Adds the times. That would take longer than either crew alone.'],[Math.abs(a-b)||ans+1,'Subtracts the times. Rates add; times do not.']],
 x=>fmtN(x)+' h',steps([`Crew 1 does 1/${a} of the job per hour, crew 2 does 1/${b}.`,`Shortcut: (${a} × ${b}) ÷ (${a} + ${b}) = ${a*b} ÷ ${a+b} = <b>${fmtN(ans)} h</b>.`,`Check: it is faster than ${Math.min(a,b)} h, the faster crew alone.`]))}),
T('ar-disc','Sale price = original × (1 − discount). For 20% off, multiply by 0.80. The discount amount itself is a trap answer.',()=>{const p=rand(4,40)*10,d=pick([10,15,20,25,30,40]);const ans=p*(1-d/100);

 [[p*d/100,'That is the discount amount, not the price you pay.'],[p*(1+d/100),`Adds ${d}% instead of taking it off.`],[p-d,`Subtracts ${d} dollars instead of ${d} percent.`]],
 money,steps([`Discount = ${d}% of ${money(p)} = ${money(p*d/100)}.`,`Sale price = ${money(p)} − ${money(p*d/100)} = <b>${money(ans)}</b>.`,`Faster: ${money(p)} × ${(1-d/100).toFixed(2)} = ${money(ans)}.`]))}),
T('ar-pct','Percent change = (new − old) ÷ old × 100. Always divide by the ORIGINAL value.',()=>{const a=pick([20,40,50,80,120,200,250,400]),pc=pick([10,15,20,25,30,40,50,75]);const b=a*(1+pc/100);
 return numQ(`A squadron's monthly flying hours rose from ${a} to ${fmtN(b)}. What was the percent increase?`,pc,

 x=>fmtN(x)+'%',steps([`Increase = ${fmtN(b)} − ${a} = ${fmtN(b-a)}.`,`Divide by the original: ${fmtN(b-a)} ÷ ${a} = ${pc/100}.`,`× 100 = <b>${pc}%</b>.`]))}),
T('ar-int','Simple interest = principal × rate × years. “Simple” means no interest on interest. The interest is not the same as the final balance.',()=>{const p=rand(2,20)*500,r=rand(2,6),t=rand(2,5);const i=p*r*t/100;
 return numQ(`How much simple interest does ${money(p)} earn at ${r}% per year for ${t} years?`,i,
 [[p*r/100,'That is interest for one year only.'],[p*Math.pow(1+r/100,t)-p,'That is compound interest. Simple interest is the same amount every year.'],[i+p,'That is the total balance (principal plus interest), not the interest.']],
 money,steps([`One year: ${money(p)} × ${r/100} = ${money(p*r/100)}.`,`${t} years: ${money(p*r/100)} × ${t} = <b>${money(i)}</b>.`]))}),
T('ar-avg','Average × count = total. Work out the total you need, subtract what you already have.',()=>{for(let k=0;k<50;k++){const s=[rand(72,95),rand(72,95),rand(72,95),rand(72,95)],x=rand(82,90);const sum=s.reduce((a,b)=>a+b,0);const need=5*x-sum;

T('ar-ratio','A ratio of r:s splits a total into r + s equal parts. Find one part (total ÷ parts), then multiply.',()=>{const r=rand(2,7),s=rand(1,6);if(r===s||gcd(r,s)>1)return null;const k=rand(3,12),n=k*(r+s);

 v=>fmtN(Math.round(v*10)/10)+'%',steps([`Pure de-icer: ${x} × ${a/100} = ${fmtN(x*a/100)} L, and ${y} × ${b/100} = ${fmtN(y*b/100)} L.`,`Total pure = ${fmtN((x*a+y*b)/100)} L in ${x+y} L of mix.`,`${fmtN((x*a+y*b)/100)} ÷ ${x+y} = <b>${fmtN(Math.round(c*10)/10)}%</b>.`]))}),
T('ar-opp','Moving apart in opposite directions: add the speeds. Same direction: subtract them.',()=>{const s1=rand(12,30)*10,s2=rand(12,30)*10,t=pick([1.5,2,2.5,3,4]);const d=(s1+s2)*t;

 v=>fmtN(v)+' NM',steps([`Opposite directions, so the gap grows at ${s1} + ${s2} = ${s1+s2} knots.`,`Distance = ${s1+s2} × ${fmtN(t)} = <b>${fmtN(d)} NM</b>.`]))}),
T('ar-catch','Catch-up problems: head start (distance) ÷ closing speed (difference in speeds) = time to catch up.',()=>{for(let k=0;k<60;k++){const d=pick([20,40,50,60,80,100]),t=rand(1,6),h=pick([1,2]);const s1=d*t/h;if(s1<100||s1>400||s1%10)continue;const s2=s1+d;

T('ar-carpet','Area problems: area = length × width. 1 square yard = 3 ft × 3 ft = 9 square feet, not 3.',()=>{const Ln=rand(4,8)*3,W=rand(3,6)*3,c=pick([12,15,18,20,24,30]);const cost=Ln*W/9*c;

 money,steps([`Area = ${Ln} × ${W} = ${Ln*W} sq ft.`,`In square yards: ${Ln*W} ÷ 9 = ${Ln*W/9} sq yd.`,`Cost = ${Ln*W/9} × ${money(c)} = <b>${money(cost)}</b>.`]))}),
T('ar-consec','Consecutive integers: call them n, n+1, n+2. Their sum is 3n + 3, so the middle one is always the sum ÷ 3.',()=>{const n=rand(8,60);const S=3*n+3;

T('ar-age','Age problems: write the “now” ages with one letter, add the same number of years to BOTH people for the future, then solve.',()=>{const [k,m,mult]=pick([[3,2,1],[4,3,2],[5,3,1],[7,4,1]]);const n=rand(4,12);const s=n*mult;const f=k*s;

T('mk-lin','Undo operations in reverse order: move the constant first (do the opposite), then divide by the coefficient.',()=>{const a=rand(2,9),x=rand(-9,12),b=rand(-20,20);if(!b)return null;const c=a*x+b;
 return Q(`Solve for ${xv}: ${lin(a,b)} = ${neg(c)}`,`${xv} = ${neg(x)}`,
 [[`${xv} = ${frac(c+b,a)}`,`Moves the ${Math.abs(b)} across without changing its sign. To undo ${b<0?M+' '+Math.abs(b):'+ '+b}, ${b<0?'add':'subtract'} ${Math.abs(b)}.`],[`${xv} = ${neg(c-b)}`,`Stops before dividing by ${a}.`],[`${xv} = ${neg(-x)}`,'Right size, wrong sign. Check the final division.'],[`${xv} = ${neg(x+1)}`,CLOSE]],
 steps([`${b<0?'Add':'Subtract'} ${Math.abs(b)} on both sides: ${a}${xv} = ${neg(c-b)}.`,`Divide by ${a}: <b>${xv} = ${neg(x)}</b>.`,`Check: ${a} × ${neg(x)} ${b<0?M:'+'} ${Math.abs(b)} = ${neg(c)}.`]))}),
T('mk-mulpow','Same base multiplied: ADD exponents. Same base divided: subtract. Power of a power: multiply.',()=>{const a=rand(2,9),b=rand(2,9);
 return Q(`Simplify: ${xv}<sup>${a}</sup> · ${xv}<sup>${b}</sup>`,`${xv}<sup>${a+b}</sup>`,
 [[`${xv}<sup>${a*b}</sup>`,'Multiplies the exponents. That rule is for a power raised to a power.'],[`2${xv}<sup>${a+b}</sup>`,'There is no 2. Multiplying x by x gives x², not 2x.'],[`${xv}<sup>${Math.abs(a-b)||a+b+1}</sup>`,'Subtracts exponents. That is the rule for division.'],[`${a+b}${xv}`,'Turns the exponent into a coefficient.'],[`${xv}<sup>${a+b+1}</sup>`,'Off by one: add the exponents exactly.']],
 `Multiplying powers with the same base adds the exponents: ${a} + ${b} = ${a+b}. So the answer is <b>${xv}<sup>${a+b}</sup></b>.`)}),
T('mk-powpow','Power of a power: MULTIPLY the exponents. (x³)² = x³ · x³ = x⁶.',()=>{const a=rand(2,6),b=rand(2,5);
 return Q(`Simplify: (${xv}<sup>${a}</sup>)<sup>${b}</sup>`,`${xv}<sup>${a*b}</sup>`,
 [[`${xv}<sup>${a+b}</sup>`,'Adds the exponents. That is the rule for multiplying two powers.'],[`${b}${xv}<sup>${a}</sup>`,'Turns the outer exponent into a coefficient.'],[`${xv}<sup>${Math.pow(a,b)}</sup>`,`Raises ${a} to the power ${b}. Multiply them instead.`],[`${xv}<sup>${a}</sup>`,'Ignores the outer exponent.'],[`${xv}<sup>${a*b+1}</sup>`,'Off by one: multiply the exponents exactly.']],
 `(${xv}<sup>${a}</sup>)<sup>${b}</sup> means ${b} copies of ${xv}<sup>${a}</sup> multiplied together, so ${a} × ${b} = ${a*b}: <b>${xv}<sup>${a*b}</sup></b>.`)}),
T('mk-eval','Substitute with brackets around each value, then follow order of operations: exponents before multiplication. A negative squared is positive.',()=>{const x=rand(-5,6),y=rand(-5,6),a=rand(2,4),b=rand(2,5);if(!x||!y)return null;const v=a*x*x-b*y;
 return Q(`If ${xv} = ${neg(x)} and <i>y</i> = ${neg(y)}, what is ${a}${xv}<sup>2</sup> ${M} ${b}<i>y</i>?`,neg(v),

 steps([`${xv}<sup>2</sup> = (${neg(x)})<sup>2</sup> = ${x*x}, so ${a}${xv}<sup>2</sup> = ${a*x*x}.`,`${b}<i>y</i> = ${b} × (${neg(y)}) = ${neg(b*y)}.`,`${a*x*x} ${M} (${neg(b*y)}) = <b>${neg(v)}</b>.`]))}),
T('mk-quad','For x² + bx + c = 0, find two numbers that MULTIPLY to c and ADD to b. The roots are those numbers with their signs flipped.',()=>{const r1=rand(-9,9),r2=rand(-9,9);if(!r1||!r2||Math.abs(r1)===Math.abs(r2))return null;const b=-(r1+r2),c=r1*r2;
 const poly=`${xv}<sup>2</sup> ${b<0?M:'+'} ${Math.abs(b)===1?'':Math.abs(b)}${xv} ${c<0?M:'+'} ${Math.abs(c)} = 0`;
 const s=(p,q)=>{const [u,v]=[p,q].sort((m,n)=>m-n);return `${xv} = ${neg(u)} or ${xv} = ${neg(v)}`};
 const f=r=>`(${xv} ${-r<0?M:'+'} ${Math.abs(r)})`;

 [[s(-r1,-r2),`These are the numbers inside the factors. The roots have the opposite sign: ${f(r1)} = 0 gives ${xv} = ${neg(r1)}.`],[s(r1,-r2),`Only one sign is right. The roots must multiply to ${neg(c)}.`],[s(-r1,r2),`Only one sign is right. The roots must add to ${neg(-b)}.`],[`${xv} = ${neg(b)} or ${xv} = ${neg(c)}`,'Uses the coefficients themselves. Find two numbers that multiply to c and add to b.'],[s(r1,r2+1),'Check: these don’t multiply to the constant term.']],
 steps([`Need two numbers that multiply to ${neg(c)} and add to ${neg(b)}: ${neg(-r1)} and ${neg(-r2)}.`,`Factor: ${f(r1)}${f(r2)} = 0.`,`Each bracket equals zero: <b>${xv} = ${neg(r1)} or ${xv} = ${neg(r2)}</b>.`]))}),
T('mk-slope','Slope = rise ÷ run = (y₂ − y₁) ÷ (x₂ − x₁). Y on top. Keep the points in the same order top and bottom.',()=>{const x1=rand(-6,6),y1=rand(-6,6),dx=rand(-8,8),dy=rand(-8,8);if(!dx||!dy||Math.abs(dx)===Math.abs(dy))return null;

 steps([`Rise = ${neg(y1+dy)} ${M} (${neg(y1)}) = ${neg(dy)}.`,`Run = ${neg(x1+dx)} ${M} (${neg(x1)}) = ${neg(dx)}.`,`Slope = ${neg(dy)} ÷ ${neg(dx)} = <b>${frac(dy,dx)}</b>.`]))}),

 if(Math.random()<.5)return numQ(`A right triangle has legs of ${A} and ${B}. How long is the hypotenuse?`,C,[[A+B,'Adds the legs. Add their squares, then take the square root.'],[C+k,CLOSE],[B+1,'Barely longer than a leg; the hypotenuse is noticeably longer.']],fmtN,
  steps([`c² = ${A}² + ${B}² = ${A*A} + ${B*B} = ${A*A+B*B}.`,`c = √${A*A+B*B} = <b>${C}</b>.`,`Shortcut: it is a ${a}-${b}-${c} triangle × ${k}.`]));

T('mk-poly','Interior angles of an n-sided polygon add to (n − 2) × 180°. Each angle of a regular polygon is that ÷ n. Exterior angles always add to 360°.',()=>{const n=pick([5,6,8,9,10,12]);const names={5:'pentagon',6:'hexagon',8:'octagon',9:'nonagon',10:'decagon',12:'dodecagon'};
 if(Math.random()<.5)return numQ(`What is the sum of the interior angles of a ${names[n]}?`,(n-2)*180,[[n*180,'Uses n × 180°. The formula is (n − 2) × 180°.'],[(n-1)*180,'Off by one: it is n − 2, not n − 1.'],[360,'360° is the sum of the exterior angles of any polygon.']],v=>fmtN(v)+'°',
  `A ${names[n]} has ${n} sides. (${n} − 2) × 180° = <b>${(n-2)*180}°</b>. (Think: it splits into ${n-2} triangles.)`);
 return numQ(`Each interior angle of a regular ${names[n]} measures:`,(n-2)*180/n,[[360/n,'That is each exterior angle.'],[(n-1)*180/n,'Uses n − 1 instead of n − 2.'],[n*180/(n-1),CLOSE]],v=>fmtN(Math.round(v*10)/10)+'°',
  `Sum = (${n} − 2) × 180° = ${(n-2)*180}°. Each = ${(n-2)*180} ÷ ${n} = <b>${fmtN((n-2)*180/n)}°</b>.`)}),
T('mk-sci','Scientific notation: multiply the front numbers, ADD the powers of ten.',()=>{const a=rand(1,4),b=rand(2,3),m=rand(-6,9),n=rand(2,8);if(a*b>=10)return null;
 const sn=(c,e)=>`${c} × 10<sup>${neg(e)}</sup>`;
 return Q(`(${sn(a,m)}) × (${sn(b,n)}) =`,sn(a*b,m+n),
 [[sn(a*b,m*n),'Multiplies the exponents. Add them.'],[sn(a+b,m+n),'Adds the front numbers. Multiply them.'],[sn(a*b,m-n),'Subtracts the exponents. That is for division.'],[sn(a*b,m+n+1),'Exponent off by one. Add them exactly.']],
 `${a} × ${b} = ${a*b}, and ${neg(m)} + ${n} = ${neg(m+n)}. Answer: <b>${sn(a*b,m+n)}</b>.`)}),
T('mk-sqrt','Simplify roots by finding the largest perfect square factor: √(k² × m) = k√m. Know squares up to 15² = 225.',()=>{const k=rand(2,9),m=pick([2,3,5,6,7,10]);
 return Q(`Simplify: √${k*k*m}`,`${k}√${m}`,
 [[`${m}√${k}`,'Swaps the parts. The square root of the perfect square comes outside.'],[`${k*k}√${m}`,`Takes ${k*k} outside without its square root. √${k*k} = ${k}.`],[`${k}√${m*2}`,`Check by squaring: (${k}√${m*2})² = ${k*k*m*2}, not ${k*k*m}.`],[`${k*m}`,'Drops the square root entirely.'],[`${k+1}√${m}`,`Check by squaring: (${k+1}√${m})² = ${(k+1)*(k+1)*m}.`]],
 steps([`${k*k*m} = ${k*k} × ${m}, and ${k*k} is a perfect square.`,`√${k*k} = ${k}, so √${k*k*m} = <b>${k}√${m}</b>.`]))}),
T('mk-gcf','GCF = biggest number that divides both. LCM = smallest number both divide into. Shortcut: LCM = (a × b) ÷ GCF.',()=>{const g=rand(2,12),a=rand(2,9),b=rand(2,9);if(a===b||gcd(a,b)>1)return null;const A=g*a,B=g*b;
 if(Math.random()<.5)return numQ(`What is the greatest common factor of ${A} and ${B}?`,g,[[A*B/g,'That is the least common multiple.'],[g*Math.min(a,b),`That is ${Math.min(A,B)} itself, which does not divide ${Math.max(A,B)}.`],[1,`They do share factors: both are divisible by ${g}.`]],fmtN,
  steps([`${A} = ${g} × ${a}; ${B} = ${g} × ${b}.`,`${a} and ${b} share no common factor, so the GCF is <b>${g}</b>.`]));
 return numQ(`What is the least common multiple of ${A} and ${B}?`,g*a*b,[[A*B,'A common multiple, but not the smallest one.'],[g,'That is the greatest common factor.'],[A+B,'Adding the numbers does not give a multiple of both.']],fmtN,
  steps([`GCF of ${A} and ${B} is ${g}.`,`LCM = ${A} × ${B} ÷ ${g} = <b>${g*a*b}</b>.`]))}),
T('mk-ineq','Solve inequalities like equations, but FLIP the sign whenever you multiply or divide by a negative number.',()=>{const a=rand(2,6),v=rand(-8,8),b=rand(-10,10);if(!v||!b)return null;const c=-a*v+b;
 return Q(`Solve: ${M}${a}${xv} ${b<0?M:'+'} ${Math.abs(b)} &gt; ${neg(c)}`,`${xv} &lt; ${neg(v)}`,
 [[`${xv} &gt; ${neg(v)}`,`Forgot to flip the sign when dividing by ${M}${a}.`],[`${xv} &lt; ${neg(-v)}`,'Sign error when moving the constant.'],[`${xv} &gt; ${neg(-v)}`,'Two errors: the constant’s sign and the flip.'],[`${xv} &lt; ${neg(v+1)}`,'Off by one. Recheck the subtraction.']],
 steps([`${b<0?'Add':'Subtract'} ${Math.abs(b)}: ${M}${a}${xv} &gt; ${neg(c-b)}.`,`Divide by ${M}${a} and flip the sign: <b>${xv} &lt; ${neg(v)}</b>.`]))}),
T('mk-prob','Probability = favorable outcomes ÷ TOTAL outcomes. Then simplify the fraction.',()=>{const r=rand(2,8),b=rand(2,8),g=rand(1,6);const t=r+b+g;
 return Q(`A bag holds ${r} red, ${b} blue and ${g} green marbles. What is the probability of drawing a red one?`,frac(r,t),
 [[frac(r,b+g),'Divides by the non-red marbles only. Divide by the total.'],[frac(b+g,t),'That is the chance of NOT drawing red.'],[frac(1,r),'This isn’t a probability of drawing red: divide red by the total.'],[frac(b,t),'That is the chance of drawing blue.'],[frac(r,t-1),'The total is off by one. Count every marble.']],
 `Total = ${r} + ${b} + ${g} = ${t}. P(red) = ${r}/${t} = <b>${frac(r,t)}</b>.`)}),
T('mk-sys','For x + y = s and x − y = d, add the two equations: the y’s cancel, giving 2x = s + d.',()=>{const s=rand(4,30),d=rand(1,s-1);if((s+d)%2)return null;const x=(s+d)/2;
 return numQ(`If ${xv} + <i>y</i> = ${s} and ${xv} ${M} <i>y</i> = ${d}, what is ${xv}?`,x,[[(s-d)/2,'That is y, not x.'],[s+d,'That is 2x. Divide by 2.'],[s-d,'That is 2y.']],fmtN,
 steps([`Add the equations: 2${xv} = ${s} + ${d} = ${s+d}.`,`${xv} = <b>${x}</b> (and y = ${(s-d)/2}).`]))}),
T('mk-fact','Difference of squares: a² − b² = (a − b)(a + b). Check any factoring by multiplying back out.',()=>{const k=rand(2,12);
 return Q(`Factor: ${xv}<sup>2</sup> ${M} ${k*k}`,`(${xv} ${M} ${k})(${xv} + ${k})`,
 [[`(${xv} ${M} ${k})<sup>2</sup>`,`Multiplies out to ${xv}² ${M} ${2*k}${xv} + ${k*k}: the middle term and the sign are wrong.`],[`(${xv} + ${k})<sup>2</sup>`,`Multiplies out to ${xv}² + ${2*k}${xv} + ${k*k}.`],[`(${xv} ${M} ${k*k})(${xv} + 1)`,`Multiplies out to ${xv}² ${M} ${k*k-1}${xv} ${M} ${k*k}.`],[`(${xv} + ${k*k})(${xv} ${M} 1)`,`Multiplies out to ${xv}² + ${k*k-1}${xv} ${M} ${k*k}.`]],
 `${k*k} = ${k}², so it is a difference of squares: <b>(${xv} ${M} ${k})(${xv} + ${k})</b>. Check: the middle terms ${M}${k}${xv} and +${k}${xv} cancel.`)}),
T('mk-vocab','Math vocabulary shows up on the test. Learn: integer, prime, factor, multiple, product, quotient, sum, difference, reciprocal, mean, median, mode.',()=>{const set=[['prime number','A whole number greater than 1 whose only factors are 1 and itself'],['reciprocal','The number that multiplies with a given number to make 1'],['quotient','The result of a division'],['product','The result of a multiplication'],['integer','A whole number that can be positive, negative or zero'],['perimeter','The distance around a figure'],['hypotenuse','The side opposite the right angle in a right triangle'],['radius','The distance from the center of a circle to its edge'],['median','The middle value of an ordered set'],['mode','The value that appears most often in a set'],['absolute value','A number’s distance from zero'],['coefficient','The number multiplying a variable']];
 const [t,d]=pick(set);return Q(`${d} is called a(n):`,t,shuffle(set.filter(s=>s[0]!==t)).map(s=>[s[0],`A ${s[0]} is ${s[1].charAt(0).toLowerCase()+s[1].slice(1)}.`]),`<b>${t}</b>: ${d.charAt(0).toLowerCase()+d.slice(1)}.`)}),
T('mk-pct','Percent means “out of 100”. p% of n = (p ÷ 100) × n. 150% is 1.5 times.',()=>{const p=pick([5,12,15,20,25,30,35,40,60,75,120,150]),n=rand(2,40)*10;
 return numQ(`What is ${p}% of ${n}?`,p*n/100,[[n/p,'Divides instead of multiplying.'],[p*n/10,'Decimal point in the wrong place.'],[p<100?n*(100-p)/100:n*2,p<100?`That is ${100-p}% of ${n}.`:'That is 200%.']],fmtN,
 `${p}% = ${p/100}. ${p/100} × ${n} = <b>${fmtN(p*n/100)}</b>.`)}),
];

/* ================= more Arithmetic Reasoning ================= */
AR.push(
T('ar-scale','Map scale: multiply the map distance by the scale. Watch the units.',()=>{const sc=pick([5,8,10,12,20,25]),d=pick([1.5,2,2.5,3,3.5,4,4.5,6]);const ans=sc*d;
 return numQ(`On a chart, 1 inch represents ${sc} nautical miles. Two airfields are ${fmtN(d)} inches apart on the chart. How far apart are they?`,ans,[[sc+d,'Adds the scale and the distance. Multiply them.'],[sc/d,`Divides. Each inch is ${sc} NM, so multiply.`],[sc*Math.floor(d),'Drops the fraction of an inch.']],v=>fmtN(v)+' NM',steps([`Each inch = ${sc} NM.`,`${fmtN(d)} × ${sc} = <b>${fmtN(ans)} NM</b>.`]))}),
T('ar-vol','Volume of a box = length × width × height. Surface area is different: it adds the areas of all six faces.',()=>{const l=rand(2,8),w=rand(2,6),h=rand(2,5);const v=l*w*h;
 return numQ(`A rectangular fuel tank is ${l} ft long, ${w} ft wide and ${h} ft deep. What is its volume?`,v,[[l+w+h,'Adds the sides. Volume multiplies them.'],[2*(l*w+w*h+l*h),'That is the surface area.'],[l*w,'That is only the area of the base.']],x=>fmtN(x)+' cu ft',steps([`Volume = ${l} × ${w} × ${h} = <b>${v} cubic feet</b>.`]))}),
T('ar-frac','Fraction of a quantity: divide by the bottom, multiply by the top. “How much is left” means subtract from the whole.',()=>{const den=pick([3,4,5,6,8]),num=rand(1,den-1);if(gcd(num,den)>1)return null;const k=rand(3,15),tot=den*k;const used=num*k;const left=tot-used;
 return numQ(`A tank holds ${tot} gallons. A flight uses ${num}/${den} of it. How many gallons are left?`,left,[[used,'That is the fuel used, not what is left.'],[tot-num,`Subtracts ${num} gallons instead of ${num}/${den} of the tank.`],[tot/den,`That is just 1/${den} of the tank.`]],v=>fmtN(v)+' gal',steps([`${num}/${den} of ${tot} = ${tot} ÷ ${den} × ${num} = ${used} gal used.`,`Left = ${tot} − ${used} = <b>${left} gal</b>.`]))}),
T('ar-fuelwt','Fuel weight: avgas weighs about 6 lb per gallon, jet fuel about 6.7 lb. Weight = gallons × pounds per gallon.',()=>{const g=rand(10,80)*5;const ans=g*6;
 return numQ(`Avgas weighs 6 pounds per gallon. How much does ${g} gallons weigh?`,ans,[[g/6,'Divides instead of multiplying.'],[g*6.7,'Uses the jet fuel figure of 6.7 lb per gallon.'],[g+6,'Adds instead of multiplying.']],v=>fmtN(Math.round(v))+' lb',steps([`${g} × 6 = <b>${ans} lb</b>.`]))}),
T('ar-wind','Groundspeed: a headwind subtracts from airspeed, a tailwind adds. Distance = groundspeed × time.',()=>{const tas=pick([120,150,180,200,240]),w=pick([20,30,40]),head=Math.random()<.5;const gs=head?tas-w:tas+w;const t=pick([2,3,4,1.5]);const d=gs*t;
 return numQ(`An aircraft with a true airspeed of ${tas} knots flies ${head?'into a headwind':'with a tailwind'} of ${w} knots for ${fmtN(t)} hours. How far does it travel over the ground?`,d,[[(head?tas+w:tas-w)*t,`Treats the ${head?'headwind':'tailwind'} as a ${head?'tailwind':'headwind'}.`],[tas*t,'Ignores the wind.'],[gs,'That is the groundspeed, not the distance.']],v=>fmtN(v)+' NM',steps([`Groundspeed = ${tas} ${head?'−':'+'} ${w} = ${gs} knots.`,`Distance = ${gs} × ${fmtN(t)} = <b>${fmtN(d)} NM</b>.`]))}),
T('ar-markup','Markup: selling price = cost × (1 + markup). The markup percent is taken on the cost.',()=>{const c=rand(4,40)*10,m=pick([10,20,25,30,40,50]);const sp=c*(1+m/100);
 return numQ(`A store buys a headset for ${money(c)} and marks it up ${m}%. What is the selling price?`,sp,[[c*m/100,'That is the markup amount only.'],[c*(1-m/100),'Takes the percent off instead of adding it.'],[c+m,`Adds ${m} dollars instead of ${m}%.`]],money,steps([`Markup = ${m}% of ${money(c)} = ${money(c*m/100)}.`,`Price = ${money(c)} + ${money(c*m/100)} = <b>${money(sp)}</b>.`]))}),
T('ar-wavg','Weighted average: multiply each average by its group size, add, then divide by the total number of people.',()=>{const n1=rand(2,6),n2=rand(2,6),a=rand(60,80),b=rand(82,98);const tot=n1*a+n2*b,n=n1+n2;if(tot%n)return null;const avg=tot/n;
 return numQ(`${n1} cadets averaged ${a} on a test and ${n2} cadets averaged ${b}. What is the average for all ${n} cadets?`,avg,[[(a+b)/2,'Averages the two averages, ignoring the group sizes.'],[tot,'That is the total of all scores, not the average.'],[(n1*b+n2*a)/n,'Pairs each average with the wrong group size.']],fmtN,steps([`Total = ${n1} × ${a} + ${n2} × ${b} = ${tot}.`,`Average = ${tot} ÷ ${n} = <b>${avg}</b>.`]))}),
T('ar-convert','Unit conversions: 1 mile = 5,280 ft; 1 NM ≈ 6,076 ft; 1 hour = 3,600 s; 1 m ≈ 3.3 ft. Converting to a smaller unit makes the number bigger.',()=>{const which=rand(0,2);
 if(which===0){const m=rand(2,9);return numQ(`How many feet are in ${m} miles?`,m*5280,[[m*3280,'Uses 3,280 (feet in a kilometer).'],[m*6076,'Uses 6,076 (feet in a nautical mile).'],[m*528,'Decimal point slipped.']],v=>Math.round(v).toLocaleString()+' ft',`1 mile = 5,280 ft, so ${m} × 5,280 = <b>${(m*5280).toLocaleString()} ft</b>.`)}
 if(which===1){const h=pick([1.5,2,2.5,3,0.75]);return numQ(`How many seconds are in ${fmtN(h)} hours?`,h*3600,[[h*60,'That is minutes, not seconds.'],[h*360,'Uses 360 instead of 3,600.'],[h*6000,'Treats an hour as 100 minutes.']],v=>Math.round(v).toLocaleString()+' s',`1 hour = 60 × 60 = 3,600 s. ${fmtN(h)} × 3,600 = <b>${(h*3600).toLocaleString()} s</b>.`)}
 const k=rand(2,12)*100;return numQ(`A runway is ${k.toLocaleString()} meters long. About how many feet is that? (1 m ≈ 3.3 ft)`,k*3.3,[[k/3.3,'Divides. Feet are smaller than meters, so the number gets bigger.'],[k*3,'Rounds 3.3 down to 3.'],[k*33,'Decimal point slipped.']],v=>Math.round(v).toLocaleString()+' ft',`${k.toLocaleString()} × 3.3 = <b>${Math.round(k*3.3).toLocaleString()} ft</b>.`)}),
T('ar-pctof','Percent of a total: part = percent × total. Reverse: total = part ÷ percent.',()=>{const p=pick([10,15,20,25,30,40,60,75]),tot=rand(4,40)*20;const part=p*tot/100;
 if(Math.random()<.5)return numQ(`A squadron of ${tot} airmen has ${p}% on leave. How many are on leave?`,part,[[tot-part,'That is the number NOT on leave.'],[tot/p,'Divides instead of multiplying.'],[p*tot/10,'Decimal point slipped.']],fmtN,`${p}% of ${tot} = ${p/100} × ${tot} = <b>${fmtN(part)}</b>.`);
 return numQ(`${fmtN(part)} airmen are on leave, which is ${p}% of the squadron. How many airmen are in the squadron?`,tot,[[part*p/100,'Takes the percent of the part. Divide by the percent instead.'],[part+p,'Adds the percent to the count.'],[part*(100-p)/100+part,'Not how percentages reverse.']],fmtN,`Total = part ÷ percent = ${fmtN(part)} ÷ ${p/100} = <b>${tot}</b>.`)}),
T('ar-tz','Time zones: Zulu (UTC) is the same everywhere. Local = UTC + offset. New York in winter is UTC − 5; Ireland in winter is UTC + 0.',()=>{const dep=rand(6,20),dur=rand(2,9),off=pick([-5,-6,-7,-8]);const arrUTC=(dep+dur)%24;const local=(arrUTC+off+24)%24;
 const f=h=>String(h).padStart(2,'0')+'00';
 return Q(`A flight departs at ${f(dep)}Z and takes ${dur} hours. The destination is UTC ${M}${-off}. What is the local arrival time?`,f(local),[[f(arrUTC),'That is the arrival time in Zulu, not local.'],[f((arrUTC-off+24)%24),'Adds the offset instead of subtracting.'],[f((dep+off+24)%24),'Converts the departure time but forgets the flight time.'],[f((local+1)%24),CLOSE]],steps([`Arrival in Zulu: ${f(dep)} + ${dur} h = ${f(arrUTC)}Z.`,`Local = Zulu ${M} ${-off} h = <b>${f(local)}</b>.`]))}),
);

MK.push(
T('mk-fracop','Fractions: to add, use a common denominator. To multiply, multiply tops and bottoms. To divide, flip the second fraction and multiply.',()=>{const a=rand(1,5),b=rand(2,8),c=rand(1,5),d=rand(2,8);if(a>=b||c>=d||b===d)return null;const op=pick(['+','×','÷']);let n,m,ex;
 if(op==='+'){n=a*d+c*b;m=b*d;ex=`Common denominator ${b*d}: ${a*d}/${b*d} + ${c*b}/${b*d} = ${n}/${m} = <b>${frac(n,m)}</b>.`}
 else if(op==='×'){n=a*c;m=b*d;ex=`Multiply tops and bottoms: (${a} × ${c}) / (${b} × ${d}) = ${n}/${m} = <b>${frac(n,m)}</b>.`}
 else{n=a*d;m=b*c;ex=`Flip the second fraction and multiply: ${a}/${b} × ${d}/${c} = ${n}/${m} = <b>${frac(n,m)}</b>.`}
 const right=frac(n,m);
 const w=[[frac(a+c,b+d),'Adds tops and bottoms separately. Fractions don’t add that way.'],[frac(a*c,b*d),'That is the product (multiplying).'],[frac(a*d+c*b,b*d),'That is the sum (adding).'],[frac(a*d,b*c),'That is the quotient (dividing).'],[frac(b*c,a*d),'Flips the wrong fraction.'],[frac(n+1,m),CLOSE],[frac(n,m+1),CLOSE]].filter(x=>x[0]!==right);
 return Q(`${a}/${b} ${op} ${c}/${d} =`,right,w,ex)}),
T('mk-ooo','Order of operations: brackets, exponents, multiply and divide (left to right), then add and subtract (left to right).',()=>{const a=rand(2,9),b=rand(2,6),c=rand(2,5),d=rand(1,9);const v=a+b*c*c-d;
 return numQ(`${a} + ${b} × ${c}<sup>2</sup> ${M} ${d} =`,v,[[(a+b)*c*c-d,'Adds before multiplying.'],[a+(b*c)*(b*c)-d,`Squares ${b} × ${c} together. Only ${c} is squared.`],[a+b*c*2-d,'Doubles instead of squaring.'],[a+b*c*c+d,`Adds ${d} instead of subtracting.`]],fmtN,steps([`Exponent first: ${c}² = ${c*c}.`,`Multiply: ${b} × ${c*c} = ${b*c*c}.`,`Left to right: ${a} + ${b*c*c} ${M} ${d} = <b>${v}</b>.`]))}),
T('mk-zeroexp','Any nonzero number to the power 0 is 1. A negative exponent means 1 over the positive power: 2⁻³ = 1/8.',()=>{const b=rand(2,5),e=rand(1,3);
 if(Math.random()<.3){const base=rand(2,40);return Q(`${base}<sup>0</sup> =`,'1',[['0','Anything except 0, raised to the power 0, is 1, not 0.'],[String(base),'The power 0 doesn’t leave the number unchanged.'],['Undefined','Only 0⁰ is a special case.'],[M+'1','It isn’t negative.']],`Any nonzero number to the power 0 equals <b>1</b>.`)}
 const p=Math.pow(b,e);return Q(`${b}<sup>${M}${e}</sup> =`,frac(1,p),[[neg(-p),'A negative exponent does not make the number negative.'],[neg(-b*e),'Multiplies the base by the exponent.'],[String(p),'Forgot to take 1 over the result.'],[frac(1,b*e),'Multiplies instead of raising to the power.']],`${b}<sup>${M}${e}</sup> = 1 ÷ ${b}<sup>${e}</sup> = <b>${frac(1,p)}</b>.`)}),
T('mk-abs','Absolute value is distance from zero, so |stuff| = k means stuff = k OR stuff = −k. There are usually two answers.',()=>{const a=rand(-9,9),k=rand(1,9);if(!a)return null;
 const s=(p,q)=>{const [u,v]=[p,q].sort((m,n)=>m-n);return `${xv} = ${neg(u)} or ${xv} = ${neg(v)}`};const inside=`${xv} ${a<0?'+':M} ${Math.abs(a)}`;
 return Q(`Solve: |${inside}| = ${k}`,s(a+k,a-k),[[`${xv} = ${neg(a+k)} only`,`Misses the second answer: the inside can also equal ${M}${k}.`],[s(-a+k,-a-k),'Moves the constant across with the wrong sign.'],[s(k,-k),'Ignores the number inside the bars.'],[s(a+k,-(a+k)),'Makes the final answer negative instead of the inside.']],
 steps([`The inside equals ${k} or ${M}${k}.`,`${inside} = ${k} gives ${xv} = ${neg(a+k)}.`,`${inside} = ${M}${k} gives ${xv} = ${neg(a-k)}.`]))}),
T('mk-area','Areas: rectangle = length × width; triangle = ½ × base × height; trapezoid = ½ × (top + bottom) × height. Perimeter adds the sides.',()=>{const kind=rand(0,2);
 if(kind===0){const l=rand(3,15),w=rand(2,12);if(l===w)return null;return numQ(`A rectangle is ${l} by ${w}. What is its area?`,l*w,[[2*(l+w),'That is the perimeter.'],[l+w,'Adds the sides.'],[l*w/2,'Halves it. Only triangles use ½.']],fmtN,`Area = ${l} × ${w} = <b>${l*w}</b>.`)}
 if(kind===1){const b=rand(2,12)*2,h=rand(3,14);return numQ(`A triangle has a base of ${b} and a height of ${h}. What is its area?`,b*h/2,[[b*h,'Forgot the ½.'],[b+h,'Adds instead of multiplying.'],[b*h/4,'Halves twice.']],fmtN,`Area = ½ × ${b} × ${h} = <b>${b*h/2}</b>.`)}
 const a=rand(3,10),b=a+rand(2,8),h=rand(2,8)*2;return numQ(`A trapezoid has parallel sides of ${a} and ${b} and a height of ${h}. What is its area?`,(a+b)*h/2,[[(a+b)*h,'Forgot the ½.'],[a*b*h/2,'Multiplies the parallel sides. Add them.'],[b*h,'Uses only the longer side.']],fmtN,`Area = ½ × (${a} + ${b}) × ${h} = <b>${(a+b)*h/2}</b>.`)}),
T('mk-vol','Volumes: box = l × w × h; cube = side³; cylinder = πr²h. Keep π in the answer when the options do.',()=>{if(Math.random()<.5){const s=rand(2,9);return numQ(`What is the volume of a cube with sides of ${s}?`,s*s*s,[[s*s,'That is the area of one face.'],[6*s*s,'That is the surface area.'],[3*s,'Multiplies by 3 instead of cubing.']],fmtN,`Volume = ${s}³ = <b>${s*s*s}</b>.`)}
 const r=rand(2,6),h=rand(2,10);const pi='<i>π</i>';return Q(`What is the volume of a cylinder with radius ${r} and height ${h}?`,`${r*r*h}${pi}`,[[`${2*r*h}${pi}`,'Uses 2r instead of r².'],[`${r*h}${pi}`,'Forgets to square the radius.'],[`${4*r*r*h}${pi}`,'Uses the diameter instead of the radius.'],[`${r*r*h}`,'Leaves out π.']],`V = ${pi}r²h = ${pi} × ${r*r} × ${h} = <b>${r*r*h}${pi}</b>.`)}),
T('mk-dist','Distance between points: √[(x₂ − x₁)² + (y₂ − y₁)²]. Midpoint: average the x’s, average the y’s.',()=>{const [a,b,c]=pick([[3,4,5],[6,8,10],[5,12,13],[8,15,17]]);const x1=rand(-5,5),y1=rand(-5,5);const x2=x1+pick([1,-1])*a,y2=y1+pick([1,-1])*b;
 if(Math.random()<.5)return numQ(`What is the distance between (${neg(x1)}, ${neg(y1)}) and (${neg(x2)}, ${neg(y2)})?`,c,[[a+b,'Adds the differences. Square them, add, then take the root.'],[a*a+b*b,'Forgot the square root.'],[Math.abs(a-b)||c+2,'Subtracts the differences.']],fmtN,steps([`The points are ${a} apart across and ${b} apart up or down.`,`√(${a}² + ${b}²) = √${a*a+b*b} = <b>${c}</b>.`]));
 if((x1+x2)%2||(y1+y2)%2)return null;const mx=(x1+x2)/2,my=(y1+y2)/2;
 return Q(`What is the midpoint of (${neg(x1)}, ${neg(y1)}) and (${neg(x2)}, ${neg(y2)})?`,`(${neg(mx)}, ${neg(my)})`,[[`(${neg((x2-x1)/2)}, ${neg((y2-y1)/2)})`,'Subtracts instead of adding.'],[`(${neg(x1+x2)}, ${neg(y1+y2)})`,'Forgot to divide by 2.'],[`(${neg(my)}, ${neg(mx)})`,'Swaps x and y.'],[`(${neg(mx+1)}, ${neg(my)})`,CLOSE]],`Average each coordinate: x = (${neg(x1)} + ${neg(x2)}) ÷ 2 = ${neg(mx)}, y = (${neg(y1)} + ${neg(y2)}) ÷ 2 = ${neg(my)}. Midpoint <b>(${neg(mx)}, ${neg(my)})</b>.`)}),
T('mk-prop','Proportions: cross-multiply. a/b = c/x means a × x = b × c, so x = b × c ÷ a.',()=>{const a=rand(2,9),k=rand(2,9),b=rand(2,12);const c=a*k;const x=b*k;
 return numQ(`Solve for ${xv}: ${a}/${b} = ${c}/${xv}`,x,[[a*c/b,'Cross-multiplies the wrong pair.'],[c-a+b,'Adds the difference instead of scaling.'],[x+k,CLOSE]],fmtN,steps([`Cross-multiply: ${a}${xv} = ${b} × ${c} = ${b*c}.`,`${xv} = ${b*c} ÷ ${a} = <b>${x}</b>.`]))}),
T('mk-stats','Mean = total ÷ count. Median = middle value after sorting. Mode = most frequent. Range = largest − smallest.',()=>{const n=pick([5,7]);let v=Array.from({length:n},()=>rand(2,20));v[1]=v[0];v=shuffle(v);const sorted=v.slice().sort((a,b)=>a-b);const kind=pick(['median','mean','range','mode']);
 const sum=v.reduce((a,b)=>a+b,0);const med=sorted[(n-1)/2];const range=sorted[n-1]-sorted[0];const counts={};v.forEach(x=>counts[x]=(counts[x]||0)+1);const maxc=Math.max(...Object.values(counts));const modes=Object.keys(counts).filter(k=>counts[k]===maxc);
 if(kind==='mode'&&modes.length>1)return null;if(kind==='mean'&&sum%n)return null;
 const ans={median:med,mean:sum/n,range,mode:+modes[0]}[kind];
 const w=[[v[(n-1)/2],'That is the middle of the unsorted list. Sort the numbers first.'],[Math.round(sum/n*10)/10,'That is the mean (average).'],[med,'That is the median (middle).'],[range,'That is the range.'],[+modes[0],'That is the mode (most frequent).'],[sorted[n-1],'That is the largest value.'],[ans+1,CLOSE],[ans+2,CLOSE]].filter(x=>x[0]!==ans).map(([x,y])=>[fmtN(x),y]);
 const how={median:`Sorted: ${sorted.join(', ')}. The middle value is <b>${med}</b>.`,mean:`Total ${sum} ÷ ${n} numbers = <b>${sum/n}</b>.`,range:`Largest ${sorted[n-1]} − smallest ${sorted[0]} = <b>${range}</b>.`,mode:`${modes[0]} appears most often (${maxc} times), so the mode is <b>${modes[0]}</b>.`}[kind];
 return Q(`What is the ${kind} of ${v.join(', ')}?`,fmtN(ans),w,how)}),
T('mk-angles','Angle facts: complementary angles add to 90°, supplementary to 180°, angles around a point to 360°. Opposite (vertical) angles are equal.',()=>{const kind=rand(0,2);const a=rand(15,75);
 if(kind===0)return numQ(`What is the complement of a ${a}° angle?`,90-a,[[180-a,'That is the supplement (adds to 180°).'],[360-a,'Uses 360°.'],[a,'Equal angles are vertical angles, not complements.']],v=>v+'°',`Complementary angles add to 90°: 90 − ${a} = <b>${90-a}°</b>.`);
 if(kind===1){const b=a+rand(20,90);return numQ(`What is the supplement of a ${b}° angle?`,180-b,[[90-b>0?90-b:270-b,'Uses 90°, which is for complements.'],[360-b,'Uses 360°.'],[b,'Supplements add to 180°; they aren’t equal.']],v=>v+'°',`Supplementary angles add to 180°: 180 − ${b} = <b>${180-b}°</b>.`)}
 const b=rand(100,160);return numQ(`Two straight lines cross. One of the four angles is ${b}°. What is the angle directly opposite it?`,b,[[180-b,'That is the angle next to it (supplementary).'],[360-b,'Uses 360°.'],[90,'Not a right angle.']],v=>v+'°',`Opposite (vertical) angles are equal: <b>${b}°</b>. The angles beside it are 180 − ${b} = ${180-b}°.`)}),
T('mk-like','Combine like terms: only x-terms combine with x-terms. To multiply two brackets, multiply every term in one by every term in the other (FOIL).',()=>{if(Math.random()<.5){const a=rand(2,9),b=rand(2,9),c=rand(1,9),d=rand(1,9);if(c===d)return null;const e=c-d;const tail=`${e<0?M:'+'} ${Math.abs(e)}`;
  return Q(`Simplify: ${a}${xv} + ${c} + ${b}${xv} ${M} ${d}`,`${a+b}${xv} ${tail}`,[[`${a+b+c-d}${xv}`,'Combines numbers with x-terms. Only like terms combine.'],[`${a*b}${xv} ${tail}`,'Multiplies the x coefficients. Add them.'],[`${a+b}${xv} + ${c+d}`,`Adds ${d} instead of subtracting it.`],[`${a+b}${xv}<sup>2</sup> ${tail}`,'Adding x-terms doesn’t square them.']],`x-terms: ${a} + ${b} = ${a+b}. Numbers: ${c} ${M} ${d} = ${neg(e)}. Result: <b>${a+b}${xv} ${tail}</b>.`)}
 const p=rand(1,9),q=rand(1,9);if(p===q)return null;const mid=p-q;const t=m=>m===0?'':` ${m<0?M:'+'} ${Math.abs(m)===1?'':Math.abs(m)}${xv}`;
 return Q(`Multiply: (${xv} + ${p})(${xv} ${M} ${q})`,`${xv}<sup>2</sup>${t(mid)} ${M} ${p*q}`,[[`${xv}<sup>2</sup> ${M} ${p*q}`,'Skips the middle (outer and inner) terms.'],[`${xv}<sup>2</sup>${t(mid)} + ${p*q}`,`Sign error on the last term: (+${p})(${M}${q}) is negative.`],[`${xv}<sup>2</sup>${t(p+q)} ${M} ${p*q}`,`Adds ${q} in the middle term instead of subtracting.`],[`2${xv}${t(mid)} ${M} ${p*q}`,'x times x is x², not 2x.']],
 steps([`First ${xv}·${xv} = ${xv}²; Outer ${xv}·(${M}${q}) = ${M}${q}${xv}; Inner ${p}·${xv} = ${p}${xv}; Last ${p}·(${M}${q}) = ${M}${p*q}.`,`Middle terms: ${p}${xv} ${M} ${q}${xv} = ${neg(mid)}${xv}.`,`Result: <b>${xv}²${t(mid)} ${M} ${p*q}</b>.`]))}),
T('mk-dec','Fractions, decimals and percents are the same number in three forms: ¾ = 0.75 = 75%. Learn the eighths: ⅛ = 0.125.',()=>{const pairs=[['1/8','0.125','12.5%'],['3/8','0.375','37.5%'],['5/8','0.625','62.5%'],['7/8','0.875','87.5%'],['1/5','0.2','20%'],['3/5','0.6','60%'],['3/4','0.75','75%'],['1/3','0.333…','33⅓%'],['2/3','0.666…','66⅔%'],['1/6','0.1666…','16⅔%'],['9/20','0.45','45%'],['7/25','0.28','28%']];const [f,d,p]=pick(pairs);
 const others=shuffle(pairs.filter(x=>x[0]!==f));
 if(Math.random()<.5)return Q(`Which decimal equals ${f}?`,d,others.map(o=>[o[1],`${o[1]} equals ${o[0]}.`]),`Divide the top by the bottom: ${f} = <b>${d}</b> (${p}).`);
 return Q(`Which fraction equals ${p}?`,f,others.map(o=>[o[0],`${o[0]} equals ${o[2]}.`]),`${p} = ${d} = <b>${f}</b>.`)}),
);

 return numQ(`Ignoring air resistance, how fast is a dropped object falling after ${t} seconds? (g = 9.8 m/s²)`,9.8*t,[[9.8,'That is the speed after one second only.'],[4.9*t*t,'That is the distance fallen in meters, not the speed.'],[32*t,'Uses the US value of g with meters.']],x=>fmtN(Math.round(x*10)/10)+' m/s',`v = g × t = 9.8 × ${t} = <b>${fmtN(9.8*t)} m/s</b>.`)}),

const VA_KEYS=Object.keys(VA_REL);
const VA_TIP='Make a short sentence that links the first pair (for example “a puppy is a young dog”). Then try that exact sentence with each option. Watch the order: “a young dog is a puppy” is not the same as “a puppy is a young dog” in reverse.';
function vaQ(){const rk=pick(VA_KEYS),R=VA_REL[rk];const [p1,p2]=shuffle(R.pairs).slice(0,2);const [A,B]=p1,[C,D]=p2;const U=s=>s.toUpperCase();
 const relatedTo=w=>VA_KEYS.filter(k=>k!==rk).flatMap(k=>VA_REL[k].pairs.filter(p=>p[0]===w).map(p=>[p[1],k]));
 if(Math.random()<.55){
  const ws=[];const seen=new Set([D]);const add=(w,why)=>{if(!seen.has(w)&&!R.pairs.some(p=>p[0]===C&&p[1]===w)){seen.add(w);ws.push([w,why])}};
  for(const [w,k] of relatedTo(C))add(w,`${U(C)} and ${U(w)} are linked, but as ${VA_REL[k].name}: ${VA_REL[k].say(C,w)}. The first pair is ${R.name}.`);
  for(const p of shuffle(R.pairs).filter(p=>p[0]!==C&&p[1]!==D).slice(0,2))add(p[1],`${U(p[1])} goes with ${U(p[0])} (${R.say(p[0],p[1])}), not with ${U(C)}.`);
  add(C===A?B:A,`${U(A)} is from the first pair, not a match for ${U(C)}.`);
  for(const k of shuffle(VA_KEYS.filter(k=>k!==rk)))for(const p of shuffle(VA_REL[k].pairs).slice(0,1))add(p[1],`${U(p[1])} has no ${R.name} link to ${U(C)}.`);
  return Q(`<span class="coord">${U(A)}</span> is to <span class="coord">${U(B)}</span> as <span class="coord">${U(C)}</span> is to`,D,ws,
   steps([`First pair: ${R.say(A,B)} (${R.name}).`,`Use the same sentence for the second pair: ${R.say(C,D)}.`,`So the answer is <b>${U(D)}</b>.`]),5,{tipOverride:VA_TIP})}
 const fmt=(x,y)=>`${x} : ${y}`;const ws=[[fmt(D,C),`Right words, wrong order. The first pair goes ${R.name.split(' to ')[0]||'one way'} first; this is reversed.`]];
 for(const k of shuffle(VA_KEYS.filter(k=>k!==rk)).slice(0,5)){const p=pick(VA_REL[k].pairs);ws.push([fmt(p[0],p[1]),`${VA_REL[k].say(p[0],p[1])}: that is ${VA_REL[k].name}, not ${R.name}.`])}

['The Fresnel lens',`<p>Before the 1820s, lighthouses used mirrors or thick glass lenses to throw light out to sea. Mirrors lost much of the light, and a lens big enough to be useful was so heavy and thick that it absorbed much of what passed through it.</p><p>The French physicist Augustin Fresnel solved the problem by cutting the lens into a series of concentric rings, each a thin slice of the curved surface it replaced. The rings bent light just as a solid lens would, but with a fraction of the glass. Prisms around the edges caught light that would otherwise escape upward or downward and redirected it toward the horizon.</p><p>A Fresnel lens could be seen more than twenty miles away. Within a few decades the design spread to lighthouses around the world, and the same idea is used today in vehicle headlights and overhead projectors.</p>`,[

['Fatigue on the night shift',`<p>Studies of shift workers consistently find that performance drops most sharply in the early morning hours, roughly between 2 and 6 a.m., when the body’s internal clock reaches its low point. During this window, reaction times slow and simple errors become more common, even in workers who feel alert.</p><p>Caffeine helps, but its benefit fades with heavy use and it can disrupt the sleep needed afterward. Short naps of twenty to thirty minutes before or during a night shift have been shown to improve alertness without the grogginess that longer naps can cause. Researchers stress that the most reliable fix is enough total sleep: workers who build up a sleep debt over several days perform worse than their own sense of tiredness suggests.</p>`,[

['Composite airframes',`<p>For most of the twentieth century, aircraft were built mainly from aluminum alloys, which are light, strong and well understood. Since the 1990s, designers have turned increasingly to composites: thin layers of carbon fiber set in a hard resin. A composite part can be made as strong as an aluminum one at a much lower weight, and it does not corrode.</p><p>Composites bring new challenges. Damage can hide below an undamaged-looking surface, so inspectors need ultrasound and other tools rather than a visual check. Repairs require careful control of temperature and curing time. Still, the weight savings translate directly into lower fuel burn, and several modern airliners and fighters now use composites for half or more of their structure.</p>`,[

['Seeing at night',`<p>The human eye uses two kinds of light-sensing cells. Cones, packed into the center of the retina, handle color and fine detail but need good light. Rods, spread around the outer retina, are far more sensitive to dim light but see no color. This is why, at night, a faint object is often easier to see if you look slightly to one side of it rather than straight at it.</p><p>Full night adaptation takes about thirty minutes, and a single glance at a bright light can undo much of it in seconds. For this reason pilots who fly at night use dim red cockpit lighting where possible and scan the sky in small steps rather than in one sweep, pausing briefly at each point.</p>`,[

['Why airliners leave contrails',`<p>On some days, airliners at cruising altitude leave long white trails across the sky; on others, at the same height, they leave nothing at all. The difference lies in the air they fly through.</p><p>Jet engines burn fuel that contains hydrogen, so their exhaust holds a great deal of water vapor. At cruising altitude the outside air is often colder than −40°. As the hot, moist exhaust mixes with it, the vapor condenses and freezes onto tiny particles in the exhaust, forming ice crystals: a condensation trail, or contrail.</p><p>Whether a contrail lasts depends on the humidity of the surrounding air. In dry air the crystals quickly turn back into vapor and the trail fades within seconds. In air that is already close to saturation, the crystals survive and can even grow, spreading the trail into a sheet of cloud that looks like natural cirrus. Researchers study these spreading contrails because, like other high clouds, they can trap heat.</p>`,[

['Crew resource management',`<p>In December 1978, an airliner approaching Portland, Oregon, had a problem with its landing gear indication. The crew circled for about an hour while they worked on it. During that time the flight engineer and first officer made comments about the fuel state, but they did not press the point forcefully, and the captain stayed focused on the gear. The aircraft ran out of fuel and crashed short of the airport.</p><p>Investigators found that the crew had the information they needed; the failure was in how they used it. Over the next years, airlines and NASA researchers developed what became known as crew resource management, or CRM. It trains crews to share information clearly, to assign one person to fly the aircraft while others solve problems, and to make it normal for junior crew members to challenge a captain when safety is at stake.</p><p>CRM is now required training for airline crews and is used widely in military aviation. Similar methods have spread to operating rooms and other high-risk teams.</p>`,[

['How GPS finds your position',`<p>The Global Positioning System began as a US military project and is operated today by the US Space Force. Around thirty satellites orbit about 20,000 kilometers up, arranged so that several are above almost any point on Earth at any time.</p><p>Each satellite carries extremely precise atomic clocks and continuously broadcasts its position and the exact time. A receiver on the ground compares the time a signal was sent with the time it arrived. Because radio waves travel at the speed of light, that delay gives the distance to the satellite. With distances to several satellites, the receiver can work out where it is. Four satellites are needed for a full fix: three for position and one more to correct the error in the receiver’s own, much less precise, clock.</p><p>The timing has to be astonishingly accurate. An error of one millionth of a second would put the position off by about 300 meters. Engineers even correct for effects predicted by Einstein’s theories of relativity, which make the satellites’ clocks run very slightly fast compared with clocks on the ground.</p>`,[
 ['The passage mainly explains:','How GPS uses precise timing to work out position',[['Who invented the atomic clock','Not discussed.'],['Why the Space Force was created','Not discussed.'],['How to repair a GPS receiver','Not discussed.'],['Why satellites orbit at 20,000 km','The height is stated, not explained.']],'Most of the passage is about timing signals and turning them into distance.'],

 ()=>{const order=shuffle([0,1,2,3,4]);const opts=order.map(i=>acts[i]);
  return {stem:`<div class="passage">${sit}</div><div class="ask">Which action is <b>${kind==='most'?'MOST':'LEAST'} effective</b>?</div>`,options:opts,answer:order.indexOf(ans),

const mixed=(n,d)=>{const g=gcd(n,d)||1;n/=g;d/=g;const w=Math.floor(n/d),r=n%d;return w?(r?`${w} ${r}/${d}`:String(w)):`${r}/${d}`};
const nCr=(n,r)=>{let v=1;for(let i=1;i<=r;i++)v=v*(n-r+i)/i;return Math.round(v)};
const fact=n=>n<=1?1:n*fact(n-1);
const lcm=(a,b)=>a/gcd(a,b)*b;
const poly=c=>{const parts=[];[[c[0],'x²'],[c[1],'x'],[c[2],'']].forEach(([k,v])=>{if(!k)return;const a=Math.abs(k);const t=(a===1&&v?'':a)+v;parts.push(parts.length?(k<0?` − ${t}`:` + ${t}`):(k<0?M+t:t))});return parts.join('')||'0'};

 return numQ(`A club sold the same number of $${a} tickets and $${b} tickets, taking ${money(tot)} in all. How many tickets did it sell altogether?`,2*n,[[n,`That is how many of <b>each</b> price. The question asks for the total, so double it.`],[tot/a,`Treats every ticket as $${a}.`],[tot/(a+b)/2,'Halves when it should double.']],fmtN,
 steps([`One $${a} ticket plus one $${b} ticket = $${a+b}.`,`${money(tot)} ÷ $${a+b} = ${n} of each.`,`${n} + ${n} = <b>${2*n} tickets</b>.`]))}),

 return numQ(`A ${money(p)} flight bag is marked ${d1}% off. At the register you get a further ${d2}% off the sale price. What do you pay?`,ans,[[p*(1-(d1+d2)/100),`Adds the discounts to ${d1+d2}%. The second discount applies to the already-reduced price.`],[p*(1-d1/100),'Applies only the first discount.'],[p*(d1/100)*(1-d2/100),'Works with the discount amount instead of the price.']],money,
 steps([`After ${d1}% off: ${money(p)} × ${fmtN(1-d1/100)} = ${money(p*(1-d1/100))}.`,`After a further ${d2}% off: ${money(p*(1-d1/100))} × ${fmtN(1-d2/100)} = <b>${money(ans)}</b>.`]))}),
T('ar-rtavg','Round-trip average speed is total distance ÷ total time, not the average of the two speeds. You spend longer at the slower speed, so the answer is lower than the simple average.',()=>{const [v1,v2]=pick([[40,60],[30,60],[60,90],[120,180],[200,300],[150,300],[100,150],[80,120]]);const d=lcm(v1,v2)*pick([1,2]);const ans=2*v1*v2/(v1+v2);if(!Number.isInteger(d/v1*60)||!Number.isInteger(d/v2*60))return null;
 return numQ(`A courier flies ${fmtN(d)} miles to a base at ${v1} mph and returns the same way at ${v2} mph. What is the average speed for the whole trip?`,ans,[[(v1+v2)/2,'Averages the two speeds. More time is spent at the slower speed, which pulls the average down.'],[v2-v1,'Subtracts the speeds.'],[v1*v2/(v1+v2),'Half the right answer. The total distance is both legs.']],x=>fmtN(x)+' mph',

T('ar-descent','Descent planning: time = altitude to lose ÷ descent rate. Distance = groundspeed × time, and divide by 60 because groundspeed is per hour.',()=>{const lose=pick([4000,6000,8000,9000,12000,15000]),r=pick([500,1000,1500,2000]),g=pick([120,150,180,240,300,360]);const t=lose/r,d=g*t/60;if(!Number.isInteger(t)||!Number.isInteger(d))return null;const A=lose+pick([2000,3000,5000]),B=A-lose;
 return numQ(`An aircraft at ${A.toLocaleString()} ft must level off at ${B.toLocaleString()} ft. It descends at ${r.toLocaleString()} ft per minute with a groundspeed of ${g} knots. How many nautical miles before the level-off point should it start down?`,d,[[t,`That is the time in minutes (${t}), not the distance.`],[g*t,'Forgets to divide by 60: groundspeed is per hour, the descent is in minutes.'],[A/r*g/60,`Uses the full ${A.toLocaleString()} ft instead of the ${lose.toLocaleString()} ft to lose.`]],x=>fmtN(x)+' NM',

T('mk-slopeint','Slope-intercept form is y = mx + b: m is the slope, b is where the line crosses the y-axis. Rearrange ax + by = c into that form by getting y alone.',()=>{const a=pick([1,2,3,4,5,6]),b=pick([1,2,3,4,5]),k=rand(1,6)*(Math.random()<.5?-1:1);const c=b*k;if(a===b)return null;const askSlope=Math.random()<.6;
 const st=`${a===1?'':a}x + ${b===1?'':b}y = ${neg(c)}`;
 if(askSlope)return Q(`What is the slope of the line ${st}?`,frac(-a,b),[[frac(a,b),'Sign error: moving the x term across makes it negative.'],[frac(-b,a),'Upside down: slope is (x coefficient ÷ y coefficient) with a minus sign.'],[neg(k),'That is the y-intercept.'],[neg(a),'Forgot to divide by the y coefficient.'],[frac(b,a),'Upside down and the wrong sign.']],steps([`Get y alone: ${b===1?'':b}y = ${neg(-a)}x + ${neg(c)}.`,b===1?`Already y = ${frac(-a,1)}x + ${neg(k)}.`:`Divide by ${b}: y = ${frac(-a,b)}x + ${neg(k)}.`,`Slope m = <b>${frac(-a,b)}</b>.`]));

T('mk-perp','Parallel lines have the same slope. Perpendicular slopes are negative reciprocals: flip the fraction and change the sign (2/3 → −3/2). They multiply to −1.',()=>{let p=rand(1,5)*(Math.random()<.5?-1:1),q=rand(1,5);if(Math.abs(p)===q)return null;const perp=Math.random()<.7;const m=frac(p,q),bb=rand(-6,6);

T('mk-polyadd','Adding or subtracting polynomials: combine matching powers only. When subtracting a bracket, change the sign of EVERY term inside it.',()=>{const A=[rand(1,6),rand(-9,9),rand(-9,9)],B=[rand(1,5),rand(-9,9),rand(-9,9)];const sub=Math.random()<.65;const R=A.map((v,i)=>sub?v-B[i]:v+B[i]);if(!R[0]||!B[1]||!B[2])return null;
 const wrongSub=[A[0]-B[0],A[1]+B[1],A[2]+B[2]],flip=[A[0]-B[0],A[1]-B[1],A[2]+B[2]];
 return Q(`Simplify: (${poly(A)}) ${sub?'−':'+'} (${poly(B)})`,poly(R),sub?[[poly(wrongSub),'Only changed the sign of the first term. Subtracting a bracket changes every sign inside.'],[poly(A.map((v,i)=>v+B[i])),'Added instead of subtracting.'],[poly(flip),'Missed the sign change on the last term.'],[poly([R[0],R[1],-R[2]]),'Sign error on the constant.']]:[[poly(A.map((v,i)=>v-B[i])),'Subtracted instead of adding.'],[poly([R[0],R[1],-R[2]]),'Sign error on the constant.'],[poly([R[0],-R[1],R[2]]),'Sign error on the x term.'],[poly([R[0]+R[1],0,R[2]]),'Combined x² and x terms, which aren’t like terms.']],
 steps([sub?`Change every sign in the second bracket: ${poly(B.map(v=>-v))}.`:'Remove the brackets; signs stay the same.',`x² terms: ${R[0]}; x terms: ${neg(R[1])}; numbers: ${neg(R[2])}.`,`<b>${poly(R)}</b>`]))}),
T('mk-formula','Formula questions: write the formula, put each given value in brackets, then work it out in order of operations.',()=>{const k=rand(0,2);
 if(k===0){const C=pick([-10,0,5,10,15,20,25,30,35,40,100]);const F=9*C/5+32;return numQ(`Use F = (9/5)C + 32 to convert ${neg(C)}°C to Fahrenheit.`,F,[[9*C/5,'Forgot to add 32.'],[5*(C-32)/9,'Used the °F → °C formula.'],[9*(C+32)/5,'Added 32 before multiplying.']],x=>fmtN(x)+'°F',steps([`(9/5) × ${neg(C)} = ${neg(9*C/5)}.`,`${neg(9*C/5)} + 32 = <b>${fmtN(F)}°F</b>.`]))}

 const r=pick([40,50,60,80,120,150,200]),t=pick([1.5,2,2.5,3,4]);const d=r*t;return numQ(`Using d = rt, how long does it take to travel ${fmtN(d)} miles at ${r} mph?`,t,[[d*r,'Multiplied. Time = distance ÷ rate.'],[r/d,'Divided the wrong way round.'],[d-r,'Subtracted.']],x=>fmtN(x)+' h',steps([`t = d ÷ r = ${fmtN(d)} ÷ ${r} = <b>${fmtN(t)} h</b>.`]))}),

T('mk-func','Function notation: f(3) means “put 3 in for x”. For f(g(x)), work from the inside out: find g first, then put that answer into f.',()=>{const a=rand(2,5),b=rand(-5,6),x=rand(-3,4);const f=v=>a*v+b,g=v=>v*v;const comp=Math.random()<.6;
 const fs=`f(x) = ${a}x ${b<0?'− '+(-b):'+ '+b}`;
 if(!comp){return Q(`If ${fs}, what is f(${neg(x)})?`,neg(f(x)),[[neg(a+x+b),'Added a and x instead of multiplying.'],[neg(a*x-b),'Sign error on the constant.'],[neg(a*(x+b)),'Multiplied a by (x + b).'],[neg(f(-x)),'Sign error on x.'],[neg(f(x)+a),'Arithmetic slip.']],steps([`f(${neg(x)}) = ${a} × (${neg(x)}) ${b<0?'− '+(-b):'+ '+b} = <b>${neg(f(x))}</b>.`]))}
 return Q(`If ${fs} and g(x) = x², what is f(g(${neg(x)}))?`,neg(f(g(x))),[[neg(g(f(x))),'That is g(f(x)): wrong order. Do the inside function g first.'],[neg(f(x)*g(x)),'Multiplied f and g instead of composing.'],[neg(f(x)+g(x)),'Added f and g.'],[neg(a*x*x-b),'Sign error on the constant.'],[neg(f(-x*x)),'Sign error: a negative number squared is positive.']],steps([`Inside first: g(${neg(x)}) = (${neg(x)})² = ${g(x)}.`,`Then f(${g(x)}) = ${a} × ${g(x)} ${b<0?'− '+(-b):'+ '+b} = <b>${neg(f(g(x)))}</b>.`]))}),
T('mk-scidiv','Dividing in scientific notation: divide the front numbers, SUBTRACT the powers. If the front number drops below 1, shift it: 0.5 × 10⁶ = 5 × 10⁵.',()=>{const q=rand(2,4),d=rand(2,4),a=q*d,e1=rand(5,12),e2=rand(2,4);const sup=n=>String(n).replace(/-/g,'⁻').replace(/\d/g,c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[c]);
 return Q(`(${a} × 10${sup(e1)}) ÷ (${d} × 10${sup(e2)}) =`,`${q} × 10${sup(e1-e2)}`,[[`${q} × 10${sup(e1+e2)}`,'Added the powers. Dividing subtracts them.'],[`${a-d} × 10${sup(e1-e2)}`,'Subtracted the front numbers. Divide them.'],[`${q} × 10${sup(e1*e2)}`,'Multiplied the powers.'],[`${a*d} × 10${sup(e1-e2)}`,'Multiplied the front numbers.']],steps([`${a} ÷ ${d} = ${q}.`,`10${sup(e1)} ÷ 10${sup(e2)} = 10${sup(e1-e2)}.`,`<b>${q} × 10${sup(e1-e2)}</b>`]))}),
T('mk-round','Rounding: find the place you are rounding to, look ONE digit to its right. 5 or more rounds up; 4 or less leaves it. Then drop everything after.',()=>{const n=rand(1000,99999)/1000;const places=pick([[1,'tenth'],[2,'hundredth'],[0,'whole number']]);const [p,name]=places;const f=Math.pow(10,p);const r=Math.round(n*f)/f,t=Math.floor(n*f)/f;if(r===t&&Math.random()<.5)return null;
 const fx=v=>v.toFixed(p);return Q(`Round ${n.toFixed(3)} to the nearest ${name}.`,fx(r),[[fx(r===t?t+1/f:t),r===t?'Rounded up when the next digit was 4 or less.':'Cut off the digits without rounding up.'],[(Math.round(n*f*10)/(f*10)).toFixed(p+1),'One decimal place too many.'],[p?(Math.round(n*f/10)/(f/10)).toFixed(p-1):String(Math.round(n/10)*10),'Rounded to the wrong place.'],[fx(r-1/f),'One unit too low.'],[fx(r+2/f),'Too high.']],`The digit after the ${name}s place is ${String(n.toFixed(3)).replace('.','')[String(Math.floor(n)).length+p]}, so the answer is <b>${fx(r)}</b>.`)}),
T('mk-recip','The reciprocal of a number is 1 divided by it: flip the fraction. For a mixed number, make it an improper fraction first: reciprocal of 2 3/4 is 4/11.',()=>{const w=rand(1,4),n=rand(1,5),d=rand(2,7);if(n>=d||gcd(n,d)>1)return null;const top=w*d+n;
 return Q(`What is the reciprocal of ${w} ${n}/${d}?`,`${d}/${top}`,[[`${top}/${d}`,'That is the same number as an improper fraction, not its reciprocal.'],[`${w} ${d}/${n}`,'Flipped only the fraction part. Convert to an improper fraction first.'],[`−${top}/${d}`,'That is the opposite (negative), not the reciprocal.'],[`${d}/${w+n}`,'Wrong conversion to an improper fraction.']],steps([`${w} ${n}/${d} = ${top}/${d}.`,`Flip it: <b>${d}/${top}</b>.`,`Check: ${top}/${d} × ${d}/${top} = 1.`]))})
);
