 steps([`Out: groundspeed ${v} − ${w} = ${v-w} kt; time ${d} ÷ ${v-w} = ${hm(t1)}.`,`Back: groundspeed ${v} + ${w} = ${v+w} kt; time ${d} ÷ ${v+w} = ${hm(t2)}.`,`Total: <b>${hm(ans)}</b>.`]))}),
T('ar-h-pctpct','A rise of p% followed by a fall of p% always ends LOWER than you started, because the fall is taken from a bigger number.',()=>{const P=pick([200,400,500,800,1000,1200]),p=pick([10,20,25,50]);const up=P*(1+p/100),ans=up*(1-p/100);
 return numQ(`A part costs ${money(P)}. Its price rises ${p}%, then the new price falls ${p}%. What is the final price?`,ans,[[P,'Assumes the rise and fall cancel.'],[up*(1+p/100),'Applies the rise twice.'],[P*(1-p/100)*(1-p/100),'Applies the fall twice.']],money,
 steps([`After the rise: ${money(P)} × ${fmtN(1+p/100)} = ${money(up)}.`,`After the fall: ${money(up)} × ${fmtN(1-p/100)} = <b>${money(ans)}</b>.`,`Net change: −${fmtN(p*p/100)}%.`]))}),
T('ar-h-compound','Compound interest: multiply by (1 + rate) once for every year. Interest is earned on the interest too, so it beats simple interest.',()=>{const P=pick([1000,2000,4000,5000,10000]),r=pick([5,10,20]);const ans=P*Math.pow(1+r/100,2);
 return numQ(`${money(P)} is invested at ${r}% interest compounded once a year. What is it worth after 2 years?`,ans,[[P*(1+2*r/100),'That is simple interest. Compound interest earns interest on the first year’s interest too.'],[ans-P,'That is the interest only, not the total.'],[P*Math.pow(1+r/100,3),'That is 3 years.']],money,
 steps([`Year 1: ${money(P)} × ${fmtN(1+r/100)} = ${money(P*(1+r/100))}.`,`Year 2: ${money(P*(1+r/100))} × ${fmtN(1+r/100)} = <b>${money(ans)}</b>.`]))}),
T('ar-h-ratio3','Three-way ratios work the same as two-way: add ALL the parts, find one part, then multiply.',()=>{const [a,b,c]=pick([[2,3,5],[1,2,3],[3,4,5],[2,5,7],[1,3,4],[2,3,7]]);const sum=a+b+c,k=rand(4,25),tot=k*sum;
 return numQ(`${tot.toLocaleString()} gallons of fuel are shared between three aircraft in the ratio ${a}:${b}:${c}. How many more gallons does the aircraft with the largest share get than the one with the smallest?`,(c-a)*k,[[c*k,'That is the largest share on its own.'],[a*k,'That is the smallest share.'],[c-a,'Uses the ratio numbers, not the gallons.']],v=>fmtN(v)+' gal',
 steps([`Total parts: ${a} + ${b} + ${c} = ${sum}.`,`One part: ${tot} ÷ ${sum} = ${k} gal.`,`Largest − smallest = (${c} − ${a}) × ${k} = <b>${(c-a)*k} gal</b>.`]))}),
T('ar-h-fuelplan','Fuel planning: flight time from distance ÷ groundspeed, PLUS the required reserve, all times burn rate. 45 minutes is 0.75 hours, not 0.45.',()=>{const s=pick([120,150,180,240]),h=pick([1,1.5,2,2.5,3]),g=pick([8,10,12,14,16,20]);const d=s*h,ans=g*(h+0.75);

 steps([`Flight time: ${d} ÷ ${s} = ${fmtN(h)} h.`,`Add the reserve: ${fmtN(h)} + 0.75 = ${fmtN(h+0.75)} h.`,`Fuel: ${g} × ${fmtN(h+0.75)} = <b>${fmtN(ans)} gal</b>.`]))}),
T('ar-h-avgremove','Averages hide totals. Turn every average back into a total (average × count), then compare totals.',()=>{const n=rand(5,10),B=rand(60,90),x=rand(40,100);const A=((n-1)*B+x)/n;if(!Number.isInteger(A)||x===A)return null;

 steps([`Total of ${n} scores: ${n} × ${A} = ${n*A}.`,`Total of the other ${n-1}: ${n-1} × ${B} = ${(n-1)*B}.`,`Removed score: ${n*A} − ${(n-1)*B} = <b>${x}</b>.`]))})

T('mk-h-quad2','When x² has a number in front, factor by grouping: multiply a × c, find two numbers that multiply to it and add to b, split the middle term.',()=>{const p=pick([1,2,3]),r=pick([2,3]),q=rand(-5,5),s=rand(-5,5);if(!q||!s||q*r===s*p)return null;const a=p*r,b=p*s+q*r,c=q*s;if(!b)return null;
 const roots=[[-q,p],[-s,r]].sort((m,n)=>m[0]/m[1]-n[0]/n[1]);const R=([n,d])=>frac(n,d);const ans=`x = ${R(roots[0])} or x = ${R(roots[1])}`;

 steps([`a × c = ${a} × ${neg(c)} = ${neg(a*c)}. Two numbers that multiply to ${neg(a*c)} and add to ${neg(b)}: ${neg(p*s)} and ${neg(q*r)}.`,`Factor: ${br(p,q)}${br(r,s)} = 0.`,`${p===1?'':p}x ${q<0?'−':'+'} ${Math.abs(q)} = 0 → x = ${frac(-q,p)}; ${r}x ${s<0?'−':'+'} ${Math.abs(s)} = 0 → x = ${frac(-s,r)}.`,`<b>${ans}</b>`]))}),
T('mk-h-sys2','Elimination: multiply the equations so one variable has matching coefficients, then add or subtract to cancel it.',()=>{const x=rand(-4,6),y=rand(-4,6);const a=rand(1,5),b=pick([-4,-3,-2,-1,1,2,3,4]),c=rand(1,5),d=pick([-4,-3,-2,-1,1,2,3,4]);if(a*d-b*c===0||x===y)return null;const e=a*x+b*y,f=c*x+d*y;
 return Q(`Solve the system:<br>${lin2(a,b,e)}<br>${lin2(c,d,f)}`,`(${neg(x)}, ${neg(y)})`,[[`(${neg(y)}, ${neg(x)})`,'Swapped x and y.'],[`(${neg(x)}, ${neg(-y)})`,'Sign error on y.'],[`(${neg(-x)}, ${neg(y)})`,'Sign error on x.'],[`(${neg(x+1)}, ${neg(y)})`,'Arithmetic slip; check in both equations.'],[`(${neg(x)}, ${neg(y+1)})`,'Arithmetic slip; check in both equations.']],

T('mk-h-fracexp','x^(m/n): take the n-th root first, then raise to the m. A negative exponent flips the result: x^(−m/n) = 1 ÷ x^(m/n).',()=>{const [base,m,n]=pick([[8,2,3],[27,2,3],[16,3,4],[32,2,5],[81,3,4],[64,2,3],[125,2,3],[16,1,2],[27,-1,3],[8,-2,3],[16,-1,2],[64,1,3],[9,3,2],[4,-3,2]]);const r=Math.round(Math.pow(base,1/n)),v=Math.pow(r,Math.abs(m));const show=m<0?`1/${v}`:String(v);

 return Q(`${base}<sup>${e}</sup> =`,show,[[m<0?String(v):`1/${v}`,m<0?'Forgot that the negative exponent means “one over”.':'Treated the exponent as negative.'],[fmtN(base*Math.abs(m)/n),'Multiplied the base by the fraction.'],[String(r),'Took the root but forgot the power.'],[String(Math.pow(r,Math.abs(m)+1)),'Raised to the wrong power.'],[fmtN(Math.pow(base,Math.abs(m))/n),'Raised to the power but divided instead of taking the root.']],
 steps([`The bottom of the exponent (${n}) is the root: ${n===2?'√':n+'th root of '}${base} = ${r}.`,`The top (${Math.abs(m)}) is the power: ${r}${SUP(Math.abs(m))} = ${v}.`,m<0?`Negative exponent: one over it, <b>1/${v}</b>.`:`<b>${v}</b>`]))}),
T('mk-h-ration','To rationalize, multiply top and bottom by the root in the denominator. √a × √a = a.',()=>{const b=pick([2,3,5,6,7]),a=pick([2,3,4,6,8,9,10,12,14,15]);const g=gcd(a,b),num=a/g,den=b/g;const ans=(num===1?'':num)+'√'+b+(den===1?'':'/'+den);
 return Q(`Simplify by rationalizing the denominator: ${a}/√${b}`,ans,[[`${a}√${b}`,`Multiplied the top by √${b} but forgot the bottom became ${b}.`],[`${frac(a,b)}`,'Lost the root.'],[`√${a*b}`,'Not equivalent.'],[`${a}/${b}`,'Dropped the root from the top.'],[`${a*b}√${b}`,'Multiplied instead of dividing.']],
 steps([`Multiply top and bottom by √${b}: ${a}√${b} / (√${b} × √${b}).`,`The bottom becomes ${b}: ${a}√${b}/${b}.`,`Simplify ${a}/${b}${g>1?` (divide by ${g})`:''}: <b>${ans}</b>.`]))}),

 if(back)return numQ(`Each interior angle of a regular polygon is ${int}°. How many sides does it have?`,n,[[360/int,'Divided 360 by the interior angle. Use the exterior angle.'],[int/10,'Not related.'],[180-int,'That is the exterior angle, not the number of sides.']],v=>fmtN(v),steps([`Exterior angle: 180° − ${int}° = ${ext}°.`,`Exterior angles add to 360°: n = 360 ÷ ${ext} = <b>${n}</b>.`]));

T('mk-h-similar','Similar figures: if lengths scale by k, areas scale by k² and volumes by k³.',()=>{const k=pick([2,3,4,5]),A=rand(3,20),vol=Math.random()<.35;

T('mk-h-arc','Arc length = (angle ÷ 360) × 2πr. Sector area = (angle ÷ 360) × πr². Find the fraction of the circle first.',()=>{const r=pick([3,4,6,9,10,12]),th=pick([30,45,60,90,120,150,180,240,270]);const area=Math.random()<.45;

T('mk-h-wordeq','Translate words to algebra piece by piece. “Less than” reverses the order: 5 less than 3n is 3n − 5. “Is” means equals.',()=>{const k=rand(2,6),c=rand(2,12),n=rand(2,15);const tw={2:'twice',3:'three times',4:'four times',5:'five times',6:'six times'}[k];const W=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'][c];const v=rand(0,2);
 let st,eq,rhs;if(v===0){rhs=k*n-c;st=`${W.charAt(0).toUpperCase()+W.slice(1)} less than ${tw} a number is ${rhs}.`;eq=`${k}n − ${c} = ${rhs}`}else if(v===1){rhs=k*n+c;st=`${W.charAt(0).toUpperCase()+W.slice(1)} more than ${tw} a number is ${rhs}.`;eq=`${k}n + ${c} = ${rhs}`}else{rhs=k*(n+c);st=`${tw.charAt(0).toUpperCase()+tw.slice(1)} the sum of a number and ${W} is ${rhs}.`;eq=`${k}(n + ${c}) = ${rhs}`}

'ar-convert':['Write the conversion factor (1 m ≈ 3.3 ft).','Going to a smaller unit, the number gets bigger: multiply.','Going to a bigger unit, the number gets smaller: divide.'],
'ar-pctof':['Part = percent (as a decimal) × whole.','If you are given the part and the percent, whole = part ÷ percent.','Check that the answer makes sense: 30% of something is less than a third of it.'],
'ar-tz':['Add the flight time to the departure time in Zulu (UTC).','Apply the destination’s offset: UTC −7 means subtract 7 hours.','If you pass midnight, add or subtract 24 hours.'],
'ar-tickets':['One pair of tickets (one of each price) costs the two prices added.','Number of each = total money ÷ price of a pair.','Total tickets = 2 × that number.'],
'ar-succdisc':['Apply the first discount: price × (1 − first discount).','Apply the second discount to THAT new price.','Never add the two percents; the second one works on a smaller price.'],
'ar-rtavg':['Average speed = total distance ÷ total time.','Find the time for each leg: distance ÷ speed.','Add the distances and add the times.','Divide. Shortcut for equal legs: 2 × v₁ × v₂ ÷ (v₁ + v₂).'],
'ar-overtime':['Regular pay = 40 × hourly rate.','Overtime rate = hourly rate × 1.5.','Overtime pay = hours over 40 × overtime rate.','Total = regular pay + overtime pay.'],
'ar-commission':['Commission = percent (as a decimal) × sales.','Total pay = base pay + commission.'],
'ar-rate':['Find the rate for one unit: amount ÷ time (per minute).','Turn the target time into the same unit (1 hour = 60 minutes).','Multiply the rate by that time.'],
'ar-descent':['Altitude to lose = start altitude − level-off altitude.','Time = altitude to lose ÷ descent rate (minutes).','Distance = groundspeed × time ÷ 60, because groundspeed is per hour.','Start the descent that many miles before the point.'],
'ar-fill':['Turn each time into a rate: the hose fills 1/a of the tank per hour; the leak empties 1/b per hour.','Net rate = fill rate − drain rate.','Time = 1 ÷ net rate. Shortcut: (a × b) ÷ (b − a).'],
'ar-perim':['Perimeter of a rectangle = 2 × (length + width).','Cost = perimeter × price per foot.','Use area (length × width) only for covering a surface, not for fencing.'],
'ar-lcm':['“Together again” means the least common multiple (LCM).','List multiples of the larger number.','The first one the smaller number divides exactly is the LCM.'],
'ar-h-mixadd':['Pure amount now = volume × current concentration.','Let x be the litres of pure liquid added. New pure amount = old pure + x; new volume = old volume + x.','Set new pure ÷ new volume = target concentration.','Solve for x. Shortcut: x = V(target − current) ÷ (100 − target).'],
'ar-h-workleave':['Turn each time into a rate per hour.','Work done together = (sum of the rates) × hours together.','Work left = 1 − work done.','Time for the remaining worker = work left ÷ their rate.'],
'ar-h-windleg':['Into the wind: groundspeed = airspeed − wind. With the wind: airspeed + wind.','Time for each leg = distance ÷ groundspeed for that leg.','Add the two times.','The round trip always takes LONGER than with no wind.'],
'ar-h-pctpct':['Apply the increase: × (1 + p).','Apply the decrease to the new value: × (1 − p).','Multiply out. Up and down by the same percent always ends LOWER than you started.'],
'ar-h-compound':['Turn the rate into a decimal.','Each year, multiply by (1 + rate).','For 2 years: principal × (1 + rate) × (1 + rate).','If asked for interest only, subtract the principal.'],
'ar-h-ratio3':['Add all the ratio numbers to get the total parts.','One part = total ÷ total parts.','Each share = its ratio number × one part.','Answer exactly what is asked (a share, or the difference between two shares).'],
'ar-h-fuelplan':['Flight time = distance ÷ groundspeed (hours).','Add the reserve time (45 min = 0.75 h).','Fuel = burn rate × total time.'],
'ar-h-avgremove':['Original total = old average × old count.','New total = new average × new count.','The removed number = original total − new total.'],
'mk-lin':['Goal: get x alone. Undo operations in reverse order.','Move the constant: add or subtract it on both sides.','Divide both sides by the number in front of x.','Check: put your x back into the original equation.'],
'mk-mulpow':['Same base multiplied: keep the base and ADD the exponents.','Same base divided: keep the base and SUBTRACT the exponents.','Different bases can’t be combined this way.'],
'mk-powpow':['A power raised to a power: MULTIPLY the exponents.','(x³)⁴ = x³ˣ⁴ = x¹².','With a number in front, raise it too: (2x³)² = 4x⁶.'],
'mk-eval':['Rewrite the expression with each value in brackets: 3(−5)² − 5(−2).','Do exponents first: a negative number squared is positive.','Then multiply, then add and subtract left to right.','Watch double negatives: −5 × −2 = +10, and subtracting a negative adds.'],
'mk-quad':['Put it in the form x² + bx + c = 0.','Find two numbers that MULTIPLY to c and ADD to b.','Write (x + p)(x + q) = 0.','Set each bracket to zero: x = −p or x = −q. Check by substituting.'],
'mk-slope':['Slope = (y₂ − y₁) ÷ (x₂ − x₁).','Subtract in the SAME order on top and bottom.','Simplify the fraction. Positive slopes rise to the right, negative slopes fall.'],
'mk-pyth':['Identify the hypotenuse: the longest side, opposite the right angle.','a² + b² = c².','Missing hypotenuse: c = √(a² + b²). Missing leg: a = √(c² − b²).','Know the common triples: 3-4-5, 5-12-13, 8-15-17, 7-24-25 and their multiples.'],
'mk-circle':['Area = πr². Circumference = 2πr = πd.','If you are given the diameter, halve it to get the radius.','Leave the answer in terms of π if the options do.'],
'mk-tri':['The angles of a triangle add up to 180°.','Add the angles you know.','Missing angle = 180° − that sum.'],
'mk-poly':['Sum of interior angles = (n − 2) × 180°, where n is the number of sides.','Each angle of a REGULAR polygon = that sum ÷ n.','Exterior angles of any polygon add up to 360°.'],
'mk-sci':['Multiply the front numbers.','ADD the powers of 10.','If the front number is 10 or more, move the decimal one place and add 1 to the power.'],
'mk-sqrt':['Find the largest perfect square that divides the number (4, 9, 16, 25, 36, 49…).','Split the root: √(36 × 7) = √36 × √7.','Take the square root of the perfect square: 6√7.'],
'mk-gcf':['GCF: list the factors of each number and pick the largest one they share (or use prime factors, lowest powers).','LCM: list multiples of the larger number until the smaller one divides it (or use prime factors, highest powers).','Check: GCF × LCM = the two numbers multiplied.'],
'mk-ineq':['Solve it like an equation: move the constant, then divide.','If you multiply or divide by a NEGATIVE number, flip the inequality sign.','Check with a test value from your answer.'],
'mk-prob':['Probability = favorable outcomes ÷ total outcomes.','Add up ALL the items for the total.','Simplify the fraction.'],
'mk-sys':['Line the equations up: x + y = s and x − y = d.','Add them: the y terms cancel, so 2x = s + d.','Solve for x, then substitute to find y if needed.'],
'mk-fact':['Spot the pattern a² − b²: two perfect squares with a minus between them.','Take the square root of each: a and b.','Write (a − b)(a + b).'],
'mk-vocab':['Learn each definition word for word; the options are other real terms, so a vague idea won’t separate them.','Link each term to an example: 7 is prime, 9 is composite, π is irrational, 2/3 is rational.'],
'mk-pct':['Turn the percent into a decimal: divide by 100.','Multiply by the number.','Quick checks: 10% moves the decimal one place; 50% is half; 25% is a quarter.'],
'mk-fracop':['Add or subtract: find a common denominator, convert both fractions, then add the tops.','Multiply: top × top over bottom × bottom.','Divide: flip the second fraction and multiply.','Simplify the result by dividing top and bottom by their GCF.'],
'mk-ooo':['Brackets first.','Then exponents.','Then multiply and divide, left to right.','Then add and subtract, left to right.'],
'mk-zeroexp':['Any nonzero number to the power 0 is 1.','A negative exponent means “one over”: x⁻ⁿ = 1 ÷ xⁿ.','Work out the positive power, then put it under 1.'],
'mk-abs':['|stuff| = k means stuff = k OR stuff = −k.','Write the two equations.','Solve each one. There are usually two answers.'],
'mk-area':['Rectangle: length × width.','Triangle: ½ × base × height.','Trapezoid: ½ × height × (sum of the two parallel sides).','Circle: πr².'],
'mk-vol':['Box: length × width × height. Cube: side³.','Cylinder: πr² × height.','Cone: ⅓πr²h. Sphere: (4/3)πr³.'],
'mk-dist':['Distance: √[(x₂ − x₁)² + (y₂ − y₁)²]. It is Pythagoras on the grid.','Midpoint: average the x values and average the y values.','Square the differences before adding; signs disappear when squared.'],
'mk-prop':['Write the two fractions equal to each other.','Cross-multiply: a × x = b × c.','Divide to get x alone.'],
'mk-stats':['Mean: add all values, divide by how many.','Median: sort the values, take the middle one (average the two middle ones if the count is even).','Mode: the value that appears most often. Range: largest − smallest.'],
'mk-angles':['Complementary angles add to 90°. Supplementary angles add to 180°.','Vertical (opposite) angles are equal.','Angles on a straight line add to 180°; around a point, 360°.'],
'mk-like':['Like terms have exactly the same variable and power.','Add their coefficients; keep the variable part.','For brackets, multiply every term in one by every term in the other (FOIL), then combine like terms.'],
'mk-dec':['Fraction → decimal: divide top by bottom.','Decimal → percent: multiply by 100.','Learn the eighths: 1/8 = 0.125, 3/8 = 0.375, 5/8 = 0.625, 7/8 = 0.875.'],
'mk-slopeint':['Get y alone to reach y = mx + b.','Move the x term to the other side (its sign changes).','Divide every term by the number in front of y.','m (the number in front of x) is the slope; b is the y-intercept, the point (0, b).'],
'mk-perp':['Find the slope of the given line (the number in front of x in y = mx + b).','Parallel: the same slope.','Perpendicular: flip the fraction and change the sign.','Check: perpendicular slopes multiply to −1.'],
'mk-polyadd':['If subtracting, change the sign of EVERY term in the second bracket.','Group like terms: x² with x², x with x, numbers with numbers.','Add the coefficients in each group.','Write the result from the highest power down.'],
'mk-formula':['Write the formula.','Replace each letter with its value, in brackets.','Work it out using the order of operations.','If you need a different letter, rearrange first (t = d ÷ r).'],
'mk-decdiv':['Count the decimal places in the number you are dividing BY.','Move the decimal point that many places right in BOTH numbers.','Now divide by a whole number.'],
'mk-mixed':['Turn each mixed number into an improper fraction: whole × bottom + top, over the bottom.','Do the operation (common denominator to add; tops and bottoms to multiply).','Turn the answer back into a mixed number: divide the top by the bottom; the remainder is the new top.'],
'mk-comb':['Decide whether order matters (different jobs, rankings) or not (a team, a group).','Order matters: multiply down: n × (n − 1) × … for r places.','Order doesn’t matter: work out the ordered count, then divide by r! (r × (r − 1) × … × 1).'],
'mk-func':['f(3) means: replace every x with 3.','For f(g(x)), work from the inside out.','Find g of the number first.','Put that result into f.'],
'mk-scidiv':['Divide the front numbers.','SUBTRACT the powers of 10 (top − bottom).','If the front number drops below 1, shift the decimal and take 1 off the power.'],
'mk-round':['Find the digit in the place you are rounding to.','Look at the ONE digit to its right.','5 or more: round up. 4 or less: leave it.','Drop every digit after the rounding place.'],
'mk-recip':['Make it a single fraction first (mixed → improper).','Flip it: the reciprocal of a/b is b/a.','Check: the number × its reciprocal = 1.'],
'mk-h-quad2':['For ax² + bx + c with a ≠ 1, multiply a × c.','Find two numbers that multiply to a × c and add to b.','Split the middle term with them and factor by grouping.','Set each bracket to zero and solve.'],
'mk-h-sys2':['Pick a variable to eliminate and make its coefficients match by multiplying one or both equations.','Add or subtract the equations so that variable cancels.','Solve for the remaining variable.','Substitute back to find the other; check in both equations.'],
'mk-h-fracexp':['A fractional exponent m/n means: take the n-th root, then raise to the power m.','Do the root first; it keeps the numbers small.','A negative exponent means one over the result.'],
'mk-h-ration':['To remove a root from the bottom, multiply top and bottom by that root.','√a × √a = a, so the bottom becomes a whole number.','Simplify the fraction that is left.'],
'mk-h-polyangle':['Interior angle of a regular n-gon = (n − 2) × 180° ÷ n.','Or use the exterior angle: 360° ÷ n, then interior = 180° − exterior.','Going backwards from an angle: exterior = 180° − interior; n = 360° ÷ exterior.'],
'mk-h-similar':['Similar shapes have all sides in the same ratio k.','Lengths scale by k.','Areas scale by k²; volumes by k³.'],
'mk-h-arc':['Find the fraction of the circle: angle ÷ 360°.','Arc length = that fraction × 2πr.','Sector area = that fraction × πr².'],
'mk-h-ineq2':['A compound inequality has three parts. Do the same thing to ALL three.','Subtract the constant from all parts.','Divide all parts by the coefficient (flip both signs if it is negative).'],
'mk-h-wordeq':['Call the unknown number n.','Translate piece by piece: “three times” = 3n, “less than” reverses order (5 less than 3n = 3n − 5), “is” = equals.','Solve the equation.','Check the answer in the words.'],
'mk-h-mono':['Raise every factor inside the brackets to the power: numbers and every variable.','Power of a power: multiply exponents.','Then multiply by the other term: multiply numbers, ADD exponents of matching variables.'],
'ps-fma':['F = m × a (newtons = kilograms × m/s²).','Rearrange as needed: a = F ÷ m, m = F ÷ a.'],
'ps-dens':['Density = mass ÷ volume.','Units: g/cm³ (water is 1 g/cm³).','Less dense than water floats; denser sinks.'],
'ps-ohm':['V = I × R (volts = amps × ohms).','Cover the one you want: I = V ÷ R, R = V ÷ I.'],
'ps-temp':['°F = (9/5 × °C) + 32.','Multiply first, then add 32.','Anchors: 0°C = 32°F, 100°C = 212°F, 37°C ≈ 98.6°F.'],
'ps-wave':['Wave speed = frequency × wavelength.','Hz × m = m/s.','Rearrange: wavelength = speed ÷ frequency.'],
'ps-speed':['Average speed = total distance ÷ total time.','Keep the units together: km and hours give km/h.'],
'ps-psi':['Pressure = force ÷ area.','Pounds ÷ square inches = psi; newtons ÷ square meters = pascals.'],
'ps-fts':['Use the anchor 60 mph = 88 ft/s.','Scale it: 30 mph is half of 60, so 44 ft/s.','Or multiply mph by 22/15.'],
'ps-ftlb':['Work = force × distance.','Pounds × feet = foot-pounds (ft·lb).','Lifting straight up, the force is the weight.'],
'ps-ftoc':['°C = (°F − 32) × 5/9.','Subtract 32 FIRST, then multiply by 5/9.'],
'ps-fall':['Speed after falling from rest = g × time.','Use g = 32 ft/s² in US units or 9.8 m/s² in SI.','Distance fallen = ½ × g × t².'],
'ps-water':['1 liter of water has a mass of 1 kg.','1 cubic foot of water weighs about 62.4 lb; 1 US gallon about 8.3 lb.','Multiply the amount by the right factor.'],
'ps-hp':['Power = work ÷ time.','Horsepower = (ft·lb per second) ÷ 550.','1 hp ≈ 746 watts.'],
'ps-weight':['Weight = mass × g.','With g = 10 m/s², weight in newtons = mass in kg × 10.'],
'ps-ke':['KE = ½ × m × v².','Square the speed FIRST.','Multiply by the mass, then halve. Units: joules.'],
'ps-mom':['Momentum = mass × velocity.','Units: kg·m/s.'],
'ps-power':['P = V × I (watts = volts × amps).','Rearrange: I = P ÷ V.'],
'ps-resist':['Series: add the resistances.','Parallel: 1/R = 1/R₁ + 1/R₂, or for two resistors R = (R₁ × R₂) ÷ (R₁ + R₂).','Parallel always gives less than the smallest resistor.'],
'ps-lever':['Balance: force × distance on one side = force × distance on the other.','Write W × d₁ = F × d₂.','Solve for the unknown force: F = W × d₁ ÷ d₂.'],
'ps-work':['Work = force × distance moved along the force.','Newtons × meters = joules.'],
'ps-pe':['PE = m × g × h.','Use g = 10 m/s² if told to; otherwise 9.8.','Units: joules.']
};

/* ================= v12: difficulty levels. DIFF[topic] = {e: easy generator, h: [hard generators]} ================= */
const DIFF={};
const clk=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+String(m%60).padStart(2,'0')};
const W2=(e,h)=>{return {e,h:Array.isArray(h)?h:(h?[h]:[])}};
const hardOf=tag=>()=>{const t=HT.find(x=>x.tag===tag);const q=t.f({});if(q)q.mtag=tag;return q};
const meth=(q,arr)=>{if(q)q.method=arr;return q};
Object.assign(DIFF,{
'ar-dist':W2(()=>{const s=pick([100,120,150,200,250,300]),h=rand(2,5);return numQ(`Speed: ${s} knots. Time: ${h} hours. Distance?`,s*h,[[s+h,'Added. Distance = speed × time.'],[s/h,'Divided.'],[s*(h+1),'One hour too many.']],v=>fmtN(v)+' NM',`Distance = speed × time = ${s} × ${h} = <b>${s*h} NM</b>.`)},
 ()=>{const s=pick([144,168,192,216,240,264,288,312,336]),m=rand(14,60)*5,dep=rand(6*60,14*60);const d=s*m/60;
  return meth(numQ(`An aircraft departs at ${clk(dep)}Z and lands at ${clk(dep+m)}Z, holding a groundspeed of ${s} knots throughout. How far did it fly?`,d,[[s*Math.floor(m/60)+s*(m%60)/100,`Treated ${m%60} minutes as 0.${String(m%60).padStart(2,'0')} hours.`],[s*m/100,'Treated the minutes as a decimal of hours.'],[s*Math.round(m/60),'Rounded the flight time to whole hours.']],v=>fmtN(v)+' NM',
  steps([`Flight time: ${clk(dep)} to ${clk(dep+m)} = ${hm(m)} = ${m} minutes.`,`In hours: ${m} ÷ 60 = ${fmtN(m/60)} h.`,`Distance: ${s} × ${fmtN(m/60)} = <b>${fmtN(d)} NM</b>.`])),['Work out the elapsed time from the two clock times (count hours, then minutes).','Turn it into hours: minutes ÷ 60.','Distance = groundspeed × hours.'])}),
'ar-time':W2(()=>{const s=pick([100,150,200,250,300]),h=rand(2,6);return numQ(`Distance: ${s*h} NM. Speed: ${s} knots. Time?`,h,[[2*h,'Used half the speed.'],[h*60,'Gave the answer in minutes.'],[h+1,'One hour too many.']],v=>fmtN(v)+' h',`Time = distance ÷ speed = ${s*h} ÷ ${s} = <b>${h} h</b>.`)},
 ()=>{const s=pick([144,180,216,240,288,300,360]),m=rand(10,50)*6,dep=rand(5*60,17*60);const d=s*m/60;if(!Number.isInteger(d))return null;
  const ans=clk(dep+m),wrongDec=clk(dep+Math.floor(m/60)*60+Math.round((m/60%1)*100)),noConv=clk(dep+Math.round(m/60*100));
  return meth(Q(`A flight of ${fmtN(d)} NM departs at ${clk(dep)}Z at a groundspeed of ${s} knots. At what time does it arrive?`,ans+'Z',[[wrongDec+'Z',`Read ${fmtN(m/60)} h as ${Math.floor(m/60)} h ${Math.round((m/60%1)*100)} min. The decimal part is a fraction of an hour: × 60.`],[clk(dep+m+60)+'Z','One hour late.'],[clk(dep+m-30)+'Z','30 minutes early.'],[noConv+'Z','Added the decimal hours as minutes.'],[clk(dep+m+15)+'Z','15 minutes late.']],
  steps([`Time: ${fmtN(d)} ÷ ${s} = ${fmtN(m/60)} h.`,`Convert: ${fmtN(m/60)} h = ${hm(m)}.`,`${clk(dep)} + ${hm(m)} = <b>${ans}Z</b>.`])),['Time = distance ÷ groundspeed, in decimal hours.','Turn the decimal part into minutes: × 60.','Add that to the departure time, carrying past 60 minutes into the hours.'])}),
'ar-fuel':W2(()=>{const b=pick([8,10,12,15,20]),h=rand(2,5);return numQ(`Burn rate: ${b} gallons per hour. Time: ${h} hours. Fuel used?`,b*h,[[b+h,'Added.'],[b/h,'Divided.'],[b*(h-1),'One hour short.']],v=>fmtN(v)+' gal',`Fuel = rate × time = ${b} × ${h} = <b>${b*h} gal</b>.`)},
 [()=>{const F=pick([60,80,90,100,120]),b1=pick([12,14,16,18]),b2=pick([8,9,10]),t1=pick([30,45,60,75,90]),t2=pick([60,90,120,150]);const used=b1*t1/60+b2*t2/60,ans=F-used;if(ans<=0||!Number.isInteger(ans*2))return null;
  return meth(numQ(`A tank holds ${F} gallons. The climb burns ${b1} gal/h for ${t1} minutes, then cruise burns ${b2} gal/h for ${hm(t2)}. How much fuel is left?`,ans,[[used,'That is the fuel used, not what is left.'],[F-b1*t1/100-b2*t2/100,'Treated minutes as decimal hours.'],[F-(b1+b2)/2*(t1+t2)/60,'Averaged the burn rates. Each phase needs its own rate.']],v=>fmtN(v)+' gal',
  steps([`Climb: ${b1} × ${fmtN(t1/60)} h = ${fmtN(b1*t1/60)} gal.`,`Cruise: ${b2} × ${fmtN(t2/60)} h = ${fmtN(b2*t2/60)} gal.`,`Left: ${F} − ${fmtN(used)} = <b>${fmtN(ans)} gal</b>.`])),['Work out each phase separately: rate × hours.','Add the phases to get total fuel used.','Subtract from the starting fuel.'])},hardOf('ar-h-fuelplan')]),
'ar-work':W2(()=>{const [a,b]=pick([[2,2],[3,6],[4,4],[6,3],[4,12],[6,6]]);return numQ(`Worker A alone: ${a} hours. Worker B alone: ${b} hours. Together: how long?`,a*b/(a+b),[[a+b,'Added the times. Add the RATES instead.'],[(a+b)/2,'Averaged the times.'],[Math.abs(a-b)||a*2,'Not how combined work works.']],v=>fmtN(v)+' h',steps([`Rates: 1/${a} + 1/${b} = ${frac(a+b,a*b)} of the job per hour.`,`Time = 1 ÷ ${frac(a+b,a*b)} = <b>${fmtN(a*b/(a+b))} h</b>.`]))},
 [()=>{const [a,b,c,t]=pick([[2,3,6,1],[3,6,6,1.5],[4,6,12,2],[6,10,15,3],[8,12,24,4],[6,9,18,3],[10,15,30,5]]);
  return meth(numQ(`Three crews can each load a cargo aircraft alone in ${a}, ${b} and ${c} hours. How long does it take all three working together?`,t,[[a*b/(a+b),'Left out the third crew.'],[(a+b+c)/3,'Averaged the times.'],[a/3,'Divided the fastest time by 3, as if all crews were equally fast.']],v=>hm(Math.round(v*60)),
  steps([`Rates: 1/${a} + 1/${b} + 1/${c}.`,`Common denominator ${c}: ${c/a}/${c} + ${c/b}/${c} + 1/${c} = ${frac(c/a+c/b+1,c)} of the job per hour.`,`Time = 1 ÷ ${frac(c/a+c/b+1,c)} = <b>${hm(t*60)}</b>.`])),['Turn every time into a rate: 1 ÷ time.','Add all the rates (use a common denominator).','Time together = 1 ÷ total rate.'])},hardOf('ar-h-workleave')]),
'ar-disc':W2(()=>{const p=pick([40,50,80,100,200]),d=pick([10,20,25,50]);return numQ(`Price: $${p}. Discount: ${d}%. New price?`,p*(1-d/100),[[p*d/100,'That is the discount, not the new price.'],[p+p*d/100,'Added the discount.'],[p-d,'Subtracted the percent as dollars.']],money,`${d}% of $${p} = ${money(p*d/100)}. $${p} − ${money(p*d/100)} = <b>${money(p*(1-d/100))}</b>.`)},
 ()=>{const d=pick([15,20,25,30,35,40,60]),o=pick([60,80,120,140,160,180,200,240,260,300]);const s=o*(1-d/100);if(!Number.isInteger(s*100))return null;
  return meth(numQ(`After a ${d}% discount, a flight helmet costs ${money(s)}. What was the original price?`,o,[[s*(1+d/100),`Added ${d}% back on to the sale price. The ${d}% was taken from the ORIGINAL, a bigger number.`],[s+d,'Added the percent as dollars.'],[s/(d/100),'Divided by the discount instead of by what is left.']],money,

const icStyle=k=>{const on=(store.ic&&store.ic[k]&&store.ic[k].length)?store.ic[k]:IC_STYLES[k].map(x=>x[0]);return pick(on)};

function viewText(h){return {0:'its tail, with the nose pointing away from you',45:'its nose pointing away from you and to the right',90:'its right side, with the nose pointing right',135:'its nose pointing toward you and to the right',180:'its nose pointing straight at you',225:'its nose pointing toward you and to the left',270:'its left side, with the nose pointing left',315:'its nose pointing away from you and to the left'}[h]}

const levelFor=S=>{if(S&&S.diff)return S.diff;if(store.hard&&S&&(S.mode||S.daily))return Math.random()<.5?'hard':'medium';return 'medium'};

 if(tag)item=sub.items.find(t=>t.tag===tag);

 for(let k=0;k<40;k++){const q=genQ(item,S);if(q){q.tag=item.tag;q.sid=sub.id;q.tip=q.tip||item.tip;if(sub.unscored)q.unscored=true;return q}if(!sub.bank&&!sub.next&&!tag)item=pickItem(sub,S)}

const LESSONS={
tr:`<p>You get a large grid of two-digit numbers. X values run across the top; Y values run down the side, positive at the top. Each question gives an X and a Y; pick the number where they meet. 40 questions in 7 minutes is about 10 seconds each, so this is pure speed and accuracy.</p>
<div class="box"><span class="label">Method</span><ol><li>Read X, find that column at the top.</li><li>Run your eye straight down the column to the Y row.</li><li>Match the value to an option. The options are in order, so scan quickly.</li></ol></div>
<div class="box trap"><span class="label">Traps</span><ul><li>Swapping X and Y. The wrong answers include the swapped cell on purpose.</li><li>Sign errors: −6 and 6 are 12 columns apart.</li><li>Landing one row or column off. Neighbouring cells are often only 1–2 apart.</li></ul></div>
<div class="box"><span class="label">Table size</span><p>The official sample shows a small 7 × 7 table. The real test’s table size isn’t published, so this trainer uses a much bigger 31 × 31 table. The real one should feel easier, not harder.</p></div>`,
ic:`<p>Each question shows two dials and four pictures of an aircraft. Pick the picture that matches the dials. 25 questions in 5 minutes: 12 seconds each.</p>
<div class="box"><span class="label">Artificial horizon (left dial)</span><ul><li>The symbol in the middle is your aircraft, seen from behind. It never moves.</li><li>The horizon line moves. A bank pointer sits at right angles to it and moves around the scale at the top.</li><li>The trainer rotates through five dial styles so you don’t get used to one look. Classic is closest to the official sample. Choose styles in Settings.</li><li><b>Bank:</b> the pointer moves <b>left</b> of zero in a <b>right</b> bank. Easier: the horizon’s right end is higher in a right bank, because the ground on your right rises up the window.</li><li><b>Pitch:</b> symbol above the line = nose up, climbing. Line above the symbol = nose down, diving. Line through the symbol = level.</li></ul></div>
<div class="box"><span class="label">Compass (right dial)</span><p>The arrow points the way the aircraft is heading. North is at the top.</p></div>
<div class="box"><span class="label">Reading the pictures</span><p>You look north at the same height as the aircraft, with east on your right. Heading north shows the tail; south, the nose points at you; east, the nose points right; west, the nose points left. The orange fin is the tail and the dark canopy is the top front.</p></div>
<div class="box"><span class="label">Fast elimination</span><p>Check bank first, then pitch, then heading. Each wrong picture usually gets one of those wrong.</p></div>`,
bc:`<p>A drawing shows a pile of identical long blocks stacked in criss-cross layers, with some blocks numbered. The official pamphlet says all the blocks in each pile are the same size and shape. For each number, count how many other blocks it touches. 30 questions in 4½ minutes: 9 seconds each. Test-takers often call this the tightest-timed subtest.</p>
<div class="box"><span class="label">What counts as touching</span><ul><li>Only blocks whose <b>flat faces</b> touch. Blocks that meet only at an edge or corner don’t count.</li><li>Blocks above, below and beside all count.</li><li>Hidden parts count. Because every block is the same length, you can tell where a block runs even when part of it is behind another.</li></ul></div>
<div class="box"><span class="label">Method</span><ol><li>Below: a block lying across the layer below usually rests on two or three blocks.</li><li>Sides: the blocks lying next to it in its own layer, usually one or two.</li><li>Above: the blocks lying across it, up to three.</li></ol><p>The official example block touches three above, three below and one beside: 7. Use the same order every time so nothing gets missed.</p></div>
<div class="box"><span class="label">After each practice answer</span><p>The picture redraws with the numbered block in orange and every block touching it in green.</p></div>`,
ai:`<p>20 questions in 8 minutes on how aircraft fly and how aviation works. Pure knowledge, so every question you’ve studied is free points.</p>
<div class="box"><span class="label">Topics covered here</span><ul><li>Forces, axes, control surfaces, high-lift devices</li><li>Aerodynamics: angle of attack, stalls, drag, load factor, spins</li><li>Instruments and their errors; airspeed types</li><li>Airports: runway numbers, markings, signs, lights</li><li>Weather: METAR codes, clouds, fronts, icing, fog</li><li>Navigation, airspace, radio and transponder codes, V-speeds</li><li>Engines: piston, turbojet, turbofan, turboprop, ramjet</li><li>Helicopters; human factors (hypoxia, G-LOC, disorientation)</li></ul></div>
<div class="box"><span class="label">Picture questions</span><p>Some questions show an aircraft from above or the side with one part in orange, or one of the six basic flight instruments. Know them by sight. The real subtest is text only, so these are for learning.</p></div>
<div class="box"><span class="label">Go further</span><p>Read the free FAA Pilot’s Handbook of Aeronautical Knowledge alongside this. The real question pool is larger than any one source.</p></div>`,
ar:`<p>25 word problems in 29 minutes: about 70 seconds each. School maths dressed up as flight, fuel, money and measurement problems.</p>
<div class="box"><span class="label">Formulas to know cold</span><ul><li>Distance = speed × time; groundspeed = airspeed ± wind</li><li>Working together: (a × b) ÷ (a + b)</li><li>Percent change = change ÷ original; markup is on the cost</li><li>Simple interest = principal × rate × years</li><li>Average × count = total; weighted average uses group sizes</li><li>Ratio r:s → total ÷ (r + s) = one part</li><li>Volume = l × w × h; 1 sq yd = 9 sq ft; 1 mile = 5,280 ft; avgas ≈ 6 lb/gal</li><li>Map scale: map distance × scale</li></ul></div>
<div class="box trap"><span class="label">Traps the wrong answers are built from</span><ul><li>Treating 45 minutes as 0.45 hours</li><li>Giving the discount instead of the price, or what’s used instead of what’s left</li><li>Dividing percent change by the new value</li><li>Giving an in-between number (one part, one year’s interest)</li></ul></div>`,
mk:`<p>25 questions in 22 minutes on algebra, geometry and number rules. About 53 seconds each.</p>
<div class="box"><span class="label">Rules to know cold</span><ul><li>Order of operations; fraction arithmetic; fraction ↔ decimal ↔ percent</li><li>Exponents: multiply → add; divide → subtract; power of a power → multiply; x⁰ = 1; x⁻ⁿ = 1/xⁿ</li><li>Inequalities: flip when multiplying or dividing by a negative</li><li>Quadratics, difference of squares, FOIL</li><li>Pythagoras (3-4-5, 5-12-13, 8-15-17); distance and midpoint</li><li>Areas (rectangle, triangle, trapezoid, circle) and volumes (box, cube, cylinder)</li><li>Angles: triangle 180°, complementary 90°, supplementary 180°, polygon (n − 2) × 180°</li><li>Mean, median, mode, range; probability; proportions</li></ul></div>
<div class="box"><span class="label">Tip</span><p>Plugging each answer back into the question is often faster than solving.</p></div>`,
wk:`<p>25 words in 5 minutes: 12 seconds each. Pick the option closest in meaning to the word in capitals.</p>
<div class="box"><span class="label">Second style: odd one out</span><p>Some prep guides also show “Which word is most different in meaning?” with five words. Find the meaning four of them share; the odd one is often an opposite. The official sample uses only “most nearly means”, so about one in ten questions here use the odd-one-out style.</p></div>
<div class="box"><span class="label">How to study</span><ul><li>A few minutes every day beats one long session a week.</li><li>Missed words come back automatically in practice until you get them right.</li><li>Unknown word? Look for roots: <i>bene</i> = good, <i>mal</i> = bad, <i>loqu</i> = speak, <i>vers</i> = turn, <i>chron</i> = time.</li></ul></div>`,
va:`<p>25 questions in 8 minutes. Two formats: “A is to B as C is to ___” (pick the word), or “A is to B as:” (pick the matching pair).</p>
<div class="box"><span class="label">Method</span><ol><li>Make a short sentence that links the first pair: “a puppy is a young dog”.</li><li>Try that exact sentence with each option.</li><li>If two fit, make the sentence more specific.</li></ol></div>
<div class="box"><span class="label">Common relationships</span><ul><li>Opposites; same meaning; mild to extreme (warm : hot)</li><li>Part to whole (petal : flower); member to group (wolf : pack)</li><li>Worker to workplace (chef : kitchen); worker to tool (surgeon : scalpel)</li><li>Animal to young (cow : calf); type to category (oak : tree)</li><li>Tool to purpose (knife : cut); instrument to what it measures (altimeter : altitude)</li><li>Material to product (wool : sweater); cause to effect (fire : smoke)</li></ul></div>
<div class="box trap"><span class="label">Traps</span><ul><li>The right words in the wrong order.</li><li>A word that is related to C, but in a different way.</li></ul></div>`,
rc:`<p>25 questions in 38 minutes: about 90 seconds each, including reading time. Short passages, several questions each.</p>
<div class="box"><span class="label">Method</span><ol><li>Skim the passage for its main point.</li><li>Read the question, then go back to the part of the passage it’s about.</li><li>Pick the answer the passage supports, not one that is merely true.</li></ol></div>
<div class="box"><span class="label">Question types</span><ul><li>Main idea or best title</li><li>Detail: what the passage states</li><li>Inference: what it suggests without saying</li><li>Word in context</li><li>Author’s purpose or attitude</li></ul></div>
<div class="box trap"><span class="label">Wrong answers are usually</span><ul><li>True in real life but not stated</li><li>Too extreme (always, never, all)</li><li>Only a detail when the question asks for the main idea</li><li>The opposite of what the passage says</li></ul></div>`,
ps:`<p>20 questions in 10 minutes: 30 seconds each. High-school physics, chemistry, and Earth and space science.</p>
<div class="box"><span class="label">Formulas and facts to know</span><ul><li>F = ma; weight = mg (g ≈ 9.8 m/s²); momentum = mv</li><li>KE = ½mv²; PE = mgh; work = force × distance; power = work ÷ time</li><li>Density = mass ÷ volume; speed = distance ÷ time; wave speed = frequency × wavelength</li><li>V = IR; series vs parallel circuits</li><li>°F = °C × 9/5 + 32; °C = (°F − 32) × 5/9; 0 K = −273°C</li><li>US units too: pounds (force), psi, ft/s (60 mph = 88 ft/s), ft·lb, horsepower (550 ft·lb/s ≈ 746 W), g ≈ 32 ft/s², water ≈ 62.4 lb/ft³</li><li>Units: newton, joule, watt, pascal, ohm, volt, ampere, hertz</li><li>Newton’s three laws; gas laws (Boyle, Charles); states of matter</li><li>Atoms: protons, neutrons, electrons; isotopes; pH</li><li>Earth layers, rock types, atmosphere layers, seasons, eclipses, tides, planets</li><li>Light: reflection, refraction, lenses, spectrum; sound: pitch and loudness</li></ul></div>`,
sj:`<p>50 questions in 35 minutes. Each scenario describes a work problem with five possible actions. You pick the MOST effective, then the LEAST effective.</p>
<div class="box"><span class="label">What usually scores well</span><ul><li>Acting with integrity, even when it is uncomfortable</li><li>Dealing with problems directly, early and privately</li><li>Using the chain of command properly: give honest input, then support the decision</li><li>Taking responsibility and fixing mistakes</li><li>Looking after your people</li></ul></div>
<div class="box trap"><span class="label">What usually scores worst</span><ul><li>Lying, covering up or cheating</li><li>Ignoring a problem, or overreacting to it</li><li>Undermining leadership or embarrassing people in public</li></ul></div>
<p class="note">The real answers are keyed by experienced officers. The keys here follow the same principles, but treat them as good judgment rather than the official key.</p>`,
sdi:`<p>240 statements in 45 minutes. You rate how well each describes you, from strongly disagree to strongly agree. There are no right answers and it isn’t part of the Pilot, Verbal or Quantitative scores.</p>
<div class="box"><span class="label">How to approach it</span><ul><li>Answer honestly and quickly. Overthinking wastes time and makes answers inconsistent.</li><li>Similar statements repeat in different wording. Trying to “game” it tends to show up as inconsistency.</li><li>Practise here only to get used to the format and pace.</li></ul></div>`};

const KEY='afoqt-trainer-v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
let store=load();
function initStore(){for(const k of['results','practice','mistakes','days','tags','errs','hist'])store[k]=store[k]||{};store.full=store.full||[];store.daily=store.daily||[];if(store.sound===undefined)store.sound=true}
initStore();
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dkey(new Date());
const shortDate=k=>{const [y,m,d]=k.split('-');return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+(+d)};
function logAnswer(n=1){const t=today();store.days[t]=(store.days[t]||0)+n}
function streak(){let n=0;const d=new Date();if(!store.days[today()])d.setDate(d.getDate()-1);while(store.days[dkey(d)]){n++;d.setDate(d.getDate()-1)}return n}
function addMistake(sid,tag){const m=store.mistakes[sid]=store.mistakes[sid]||{};m[tag]=Math.min(3,(m[tag]||0)+1)}
function clearMistake(sid,tag){const m=store.mistakes[sid];if(m&&m[tag]){m[tag]--;if(m[tag]<=0)delete m[tag]}}
const mistakeCount=sid=>Object.keys(store.mistakes[sid]||{}).length;
const trackable=id=>!['tr','ic','bc','va','sdi'].includes(id);
function record(q,chosen,secs){if(q.unscored)return;const sid=q.sid;const ok=chosen===q.answer;
 const tg=store.tags[sid]=store.tags[sid]||{};const v=tg[q.tag]=tg[q.tag]||{n:0,c:0,t:0,tn:0};v.n++;if(ok)v.c++;if(secs!=null){v.t+=secs;v.tn++}
 const hs=store.hist[sid]=store.hist[sid]||{};const h=hs[today()]=hs[today()]||{n:0,c:0};h.n++;if(ok)h.c++;
 if(!ok&&chosen!==null&&chosen!==undefined&&q.errk&&q.errk[chosen]){const e=store.errs[sid]=store.errs[sid]||{};for(const k of[].concat(q.errk[chosen]))e[k]=(e[k]||0)+1}
 if(trackable(sid)){if(ok){if(q.retry||q.review)clearMistake(sid,q.tag)}else addMistake(sid,q.tag)}}

let AC=null;
const SND_CAT={step:'answers',select:'ui',open:'ui',back:'ui',toggle:'ui',sheet:'ui',start:'ui',right:'answers',wrong:'answers',combo:'answers',done:'answers',warn:'timer',tick:'timer'};
function snd(type,force,arg=1,delay=0){if(!store.sound&&!force)return;const cat=SND_CAT[type];if(!force&&store.sndCats&&store.sndCats[cat]===false)return;const VM=(store.vol??70)/70;if(VM<=0)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const lat=delay?(AC.outputLatency||AC.baseLatency||0):0;const t0=AC.currentTime+Math.max(0,delay-lat);
 const tone=(f,d,st=0,vol=.06,wave='sine',f2)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=wave;o.frequency.setValueAtTime(f,t0+st);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+st+d);g.gain.setValueAtTime(0,t0+st);g.gain.linearRampToValueAtTime(vol*VM,t0+st+.006);g.gain.exponentialRampToValueAtTime(.0001,t0+st+d);o.connect(g);g.connect(AC.destination);o.start(t0+st);o.stop(t0+st+d+.03)};
 const noise=(d,st=0,vol=.04,from=800,to=3000)=>{const len=Math.floor(AC.sampleRate*d);const buf=AC.createBuffer(1,len,AC.sampleRate);const ch=buf.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=buf;const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(from,t0+st);f.frequency.exponentialRampToValueAtTime(to,t0+st+d);
  const g=AC.createGain();g.gain.setValueAtTime(0,t0+st);g.gain.linearRampToValueAtTime(vol*VM,t0+st+d*.3);g.gain.exponentialRampToValueAtTime(.0001,t0+st+d);src.connect(f);f.connect(g);g.connect(AC.destination);src.start(t0+st);src.stop(t0+st+d+.02)};
 switch(type){
  case 'step':{const f=523*Math.pow(2,(arg-1)*2/12);tone(f,.1,0,.05,'triangle');tone(f*2,.07,0,.015);break}
  case 'select':tone(1250,.04,0,.04,'triangle');break;
  case 'open':tone(520,.05,0,.035,'triangle');tone(780,.07,.045,.035,'triangle');break;
  case 'back':tone(780,.05,0,.035,'triangle');tone(520,.07,.045,.035,'triangle');break;
  case 'toggle':tone(900,.03,0,.04,'square');tone(1200,.03,.04,.03,'square');break;
  case 'right':tone(660,.12,0,.06);tone(990,.22,.08,.06);break;
  case 'wrong':tone(196,.16,0,.07,'square',150);tone(147,.3,.14,.07,'square',110);noise(.12,0,.02,300,200);break;
  case 'combo':tone(660,.1,0,.05);tone(830,.1,.08,.05);tone(990,.1,.16,.05);tone(1320,.25,.24,.05);break;
  case 'sheet':noise(.18,0,.025,600,2400);break;
  case 'warn':tone(880,.12,0,.05,'square');tone(880,.12,.18,.05,'square');break;
  case 'tick':tone(1600,.03,0,.025,'square');break;
  case 'done':tone(523,.14,0,.05);tone(659,.14,.12,.05);tone(784,.14,.24,.05);tone(1047,.4,.36,.05);break;
  case 'start':tone(392,.08,0,.04,'triangle');tone(523,.08,.08,.04,'triangle');tone(784,.16,.16,.045,'triangle');break;
 }
}catch(e){}}

function lineChart(vals){const W=640,H=200,l=44,r=18,t=18,b=28;const n=vals.length;const X=i=>l+(n===1?(W-l-r)/2:i*(W-l-r)/(n-1)),Y=v=>t+(1-v/100)*(H-t-b);
 let g='';for(const v of[0,25,50,75,100])g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" class="cg"/><text x="${l-8}" y="${Y(v)+4}" text-anchor="end" class="ct">${v}%</text>`;
 g+=`<line x1="${l}" x2="${W-r}" y1="${Y(95)}" y2="${Y(95)}" class="ctarget"/><text x="${l+6}" y="${Y(95)-6}" class="ct good">target 95%</text>`;
 g+=`<polyline points="${vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}" class="cline"/>`;
 g+=vals.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i===n-1?5.5:3.5}" class="cdot${i===n-1?' last':''}"/>`).join('');
 const lv=vals[n-1];g+=`<text x="${X(n-1)-(n>1?10:0)}" y="${lv>85?Y(lv)+20:Y(lv)-12}" text-anchor="${n>1?'end':'middle'}" class="ct strong">${lv}%</text>`;
 g+=`<text x="${l}" y="${H-6}" class="ct">run 1</text>`+(n>1?`<text x="${W-r}" y="${H-6}" text-anchor="end" class="ct">run ${n}</text>`:'');
 return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Timed run scores">${g}</svg>`}
function dayBars(hist){const W=640,H=180,l=44,r=8,t=18,b=28;const ks=[];const d=new Date();d.setDate(d.getDate()-13);for(let i=0;i<14;i++){ks.push(dkey(d));d.setDate(d.getDate()+1)}
 const bw=(W-l-r)/14;const Y=v=>t+(1-v/100)*(H-t-b);let g='';
 for(const v of[0,50,100])g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" class="cg"/><text x="${l-8}" y="${Y(v)+4}" text-anchor="end" class="ct">${v}%</text>`;
 ks.forEach((k,i)=>{const h=hist[k];const x=l+i*bw+4,w=bw-8,cx=x+w/2;
  if(h&&h.n){const v=Math.round(h.c/h.n*100);g+=`<rect x="${x.toFixed(1)}" y="${Y(v).toFixed(1)}" width="${w.toFixed(1)}" height="${(Y(0)-Y(v)).toFixed(1)}" rx="3" class="cbar"/><text x="${cx.toFixed(1)}" y="${(Y(v)-5).toFixed(1)}" text-anchor="middle" class="ct">${h.n}</text>`}
  else g+=`<rect x="${x.toFixed(1)}" y="${Y(0)-2}" width="${w.toFixed(1)}" height="2" class="cbar empty"/>`;
  if(i===0||i===7||i===13)g+=`<text x="${cx.toFixed(1)}" y="${H-6}" text-anchor="middle" class="ct">${i===13?'today':shortDate(k)}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Daily accuracy">${g}</svg>`}
const lvl=p=>p>=90?'good':p<70?'bad':'';
const topicRow=(name,c,n,drill)=>{const p=Math.round(c/n*100);return `<div class="topic"><div class="tname">${name}<span>${c} of ${n} right</span></div><div class="tbar"><i class="${lvl(p)}" style="width:${p}%"></i></div><span class="num">${p}%</span>${drill?`<button class="btn small" data-drill="${drill}">Drill</button>`:'<span></span>'}</div>`};
const errRow=(name,k,tot)=>{const p=Math.round(k/tot*100);return `<div class="topic"><div class="tname">${name}<span>${k} time${k===1?'':'s'}</span></div><div class="tbar"><i class="bad" style="width:${p}%"></i></div><span class="num">${p}%</span><span></span></div>`};
function itemLabel(id,tag){const i=+tag.split('-')[1];
 if(id==='ai')return [AI_BANK[i][0],AI_BANK[i][1]];if(id==='wk')return [WORDS[i][0].toUpperCase(),WORDS[i][1]];

 ${q.retry?'<span class="tag">Retry: same type you missed</span>':q.review?'<span class="tag">From your mistake list</span>':''}${!S.diff&&q.level==='hard'?'<span class="tag">Hard version</span>':''}
 ${tableBlock}
 <div class="stem">${reveal&&q.revealStem?q.revealStem:q.stem}</div>
 <div class="opts ${cls}">${q.options.map((o,i)=>{let c='';if(reveal){if(i===q.answer)c='right';else if(i===chosen)c='wrong'}else if(chosen===i)c='sel';
   return `<button class="opt ${c}" data-i="${i}" ${reveal?'disabled':''} aria-label="Option ${L[i]}"><span class="key">${c==='right'?'✓':c==='wrong'?'✗':L[i]}</span><span class="val">${o}</span></button>`}).join('')}</div>
 ${!timed&&!reveal&&q.tip?`<div><button class="btn small" id="hintb">Show hint</button></div><div class="hint" id="hint" hidden>${q.tip}</div>`:''}
 </div>
 ${timed?`<div class="nav"><button class="btn" id="prev" ${S.i===0?'disabled':''}>Previous</button><button class="btn primary" id="nextq">${last?'Finish':'Next'}</button></div>`:''}
 ${abar}
 ${reveal&&S.showExpl?'<div class="sheet-spacer"></div>':''}
 </div>${sheet}`;
 updTimer();
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
 on('helpb',()=>helpSheet(sid),'sheet');
 document.getElementById('quit').onclick=()=>{snd('back');if(S.test||S.daily)quitConfirm();else if(timed)finishConfirm();else finishPractice()};
 const hb=document.getElementById('hintb');if(hb)hb.onclick=()=>{snd('toggle');document.getElementById('hint').hidden=false;hb.parentElement.remove()};
 on('next',nextPractice,'open');
 on('explain',()=>{S.showExpl=true;render()},'sheet');if(reveal&&S.showExpl)stepperInit(q);
 if(reveal&&isBC){animateBC(q);const fb=document.querySelector('.figbox');fb.classList.add('replay');fb.onclick=()=>animateBC(q,true)}on('hideex',()=>{S.showExpl=false;render()},'back');
 if(timed){on('prev',()=>{S.i--;render()},'back');
  document.getElementById('nextq').onclick=()=>{if(last){snd('select');finishConfirm()}else{snd('open');S.i++;render()}}}
 const tb=document.getElementById('tbox');
 if(tb){if(S.scroll&&S.scrollTable===q.table){tb.scrollLeft=S.scroll[0];tb.scrollTop=S.scroll[1]}
  if(reveal){const hc=document.getElementById('hitcell');if(hc){const r=hc.getBoundingClientRect(),br=tb.getBoundingClientRect();tb.scrollLeft+=r.left-br.left-br.width/2+r.width/2;tb.scrollTop+=r.top-br.top-Math.min(60,br.height/3)}}
  tb.onscroll=()=>{S.scroll=[tb.scrollLeft,tb.scrollTop];S.scrollTable=q.table}}}
function animateBC(q,replay){const svg=document.querySelector('.figbox .bcfig');if(!svg)return;(S.animT||[]).forEach(clearTimeout);S.animT=[];
 const F=q.fig,t=q.target,r=F.rel[t];const near=[...r.below,...r.side,...r.above];
 const cnt=document.getElementById('bccount'),leg=document.getElementById('bclegend'),num=cnt.querySelector('b');let n=0;
 if(replay){svg.getAnimations&&svg.getAnimations({subtree:true}).forEach(a=>a.cancel());svg.classList.remove('zoom','nofx');svg.querySelectorAll('.fc,.wire').forEach(e=>e.classList.remove('t','n','on'));[cnt,leg].forEach(e=>e.classList.remove('on','nofx'));num.textContent='0';void svg.getBoundingClientRect()}
 const POP=240,PEAK=0.4;/* the chime is timed to the peak of the pop */
 const pop=els=>els.forEach(e=>e.animate&&e.animate([{transform:'scale(.55)'},{transform:'scale(1.22)',offset:PEAK},{transform:'scale(1)'}],{duration:POP,easing:'cubic-bezier(.2,.7,.3,1)'}));
 const mark=(id,c,anim)=>{const els=[...svg.querySelectorAll(`.fc[data-b="${id}"]`)];els.forEach(e=>e.classList.add(c));const w=svg.querySelector(`.wire[data-b="${id}"]`);if(w){w.classList.add(c,'on');els.push(w)}if(anim)pop(els)};
 const bump=()=>{num.classList.remove('bump');void num.offsetWidth;num.classList.add('bump')};
 const steps=[()=>svg.classList.add('zoom'),anim=>{mark(t,'t',anim);cnt.classList.add('on')},...near.map(id=>anim=>{mark(id,'n',anim);n++;num.textContent=n;if(anim){bump();snd('step',false,n,(POP*PEAK+55)/1000)}}),()=>{svg.querySelectorAll('.wire:not(.on)').forEach(w=>w.classList.add('on'));leg.classList.add('on')}];
 S.animDone=S.animDone||{};const key=S.qs.length+':'+S.i;
 const instant=!replay&&(S.animDone[key]||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches));S.animDone[key]=true;
 if(instant){svg.classList.add('nofx');[cnt,leg].forEach(e=>e.classList.add('nofx'));steps.forEach(f=>f(false));return}
 let at=0;steps.forEach((f,i)=>{at+=i===0?20:i===1?240:i===steps.length-1?240:200;S.animT.push(setTimeout(()=>f(true),at))})}
function helpSheet(sid){if(document.getElementById('help'))return;const d=document.createElement('div');d.className='sheet';d.id='help';
 d.innerHTML=`<div class="sheet-head"><div class="verdict">${subById(sid).name}</div><button class="btn ghost small" id="hclose">Close</button></div><div class="sheet-body"><div class="lesson">${LESSONS[sid]}</div>${rulesBox(sid)}</div>`;
 document.body.appendChild(d);on('hclose',()=>d.remove(),'back')}
function finishConfirm(){const blank=S.ans.filter(a=>a===null).length;if(!blank){finish();return}
 const n=document.querySelector('.nav');if(!n)return;n.innerHTML=`<div class="confirm"><span>${blank} unanswered. Guessing costs nothing. Finish anyway?</span><button class="btn primary" id="f2">Finish</button><button class="btn" id="f3">Keep going</button></div>`;
 on('f2',finish,'select');on('f3',render,'back')}
function quitConfirm(){if(document.getElementById('qc'))return;const n=document.querySelector('.bar');const d=document.createElement('div');d.className='confirm';d.id='qc';d.innerHTML=`<span>Quit? This run won’t be saved.</span><button class="btn" id="q1">Quit</button><button class="btn primary" id="q2">Keep going</button>`;
 n.after(d);on('q1',home,'back');on('q2',()=>d.remove(),'select')}
function choose(i){const timed=S.mode==='timed';if(!timed&&S.ans[S.i]!==null)return;
 if(timed){snd('select');S.ans[S.i]=i;render();return}
 S.ans[S.i]=i;S.showExpl=false;S.lastTook=Math.round((Date.now()-S.qT0)/1000);
 const q=S.qs[S.i];if(q.unscored){snd('select');S.done++;logAnswer();save();setTimeout(nextPractice,160);return}const ok=i===q.answer;S.done++;if(ok){S.correct++;S.run++}else S.run=0;
 const p=store.practice[S.sub.id]||{n:0,c:0};p.n++;if(ok)p.c++;store.practice[S.sub.id]=p;logAnswer();
 record(q,i,S.lastTook);if(!ok)S.retry.push({tag:q.tag,due:S.done+3});
 save();snd(ok?(S.run>0&&S.run%5===0?'combo':'right'):'wrong');render()}
function nextPractice(){S.showExpl=false;pushPractice();S.i=S.qs.length-1;if(S.qs.length>80){S.qs.shift();S.ans.shift();S.i--}render()}
document.addEventListener('keydown',e=>{if(!S||e.target.tagName==='INPUT')return;const k=e.key.toUpperCase();const idx=L.indexOf(k);
 if(idx>=0&&idx<S.qs[S.i].options.length&&k.length===1){choose(idx);return}
 if(e.key==='Enter'){const b=document.getElementById('next')||document.getElementById('nextq');if(b){e.preventDefault();b.click()}}
 if(e.key==='ArrowLeft'&&S.mode==='timed'){const b=document.getElementById('prev');if(b&&!b.disabled)b.click()}});
function finishPractice(){clearInterval(tick);const s=S;
 if(!s.done){S=null;home();return}
 if(s.sub.unscored){S=null;page(`<div class="wrap"><button class="back" id="back">Home</button><div class="mast"><span class="eyebrow">${s.sub.name}</span><h1>${s.done} statements done</h1><p>There are no right answers, so there is no score. On the real test, answer all 240 honestly and at a steady pace.</p></div></div>`);on('back',home,'back');return}
 const missed=s.qs.map((q,i)=>({q,a:s.ans[i]})).filter(x=>x.a!==null&&x.a!==x.q.answer);
 results(s,s.correct,s.done,elapsed(),missed,false)}
function finish(){if(!S)return;clearInterval(tick);const s=S;const secs=Math.min(elapsed(),s.limit);
 s.qs.forEach((q,i)=>record(q,s.ans[i],null));
 const scored=s.qs.map((q,i)=>i).filter(i=>!s.qs[i].unscored);const correct=scored.reduce((n,i)=>n+(s.ans[i]===s.qs[i].answer?1:0),0);const total=scored.length;
 const answered=s.ans.filter(a=>a!==null).length;logAnswer(answered);
 const missed=scored.map(i=>({q:s.qs[i],a:s.ans[i]})).filter(x=>x.a!==x.q.answer);
 S=null;
 if(s.daily){const parts={};s.qs.forEach((q,i)=>{const p=parts[q.sid]=parts[q.sid]||{c:0,n:0};p.n++;if(s.ans[i]===q.answer)p.c++});
  const rv=s.qs.map((q,i)=>({q,a:s.ans[i]})).filter(x=>x.q.review);const rvOk=rv.filter(x=>x.a===x.q.answer).length;
  const rec={ts:Date.now(),date:today(),correct,total,secs,parts,rv:rv.length,rvOk};store.daily.push(rec);save();snd('done');dailyResults(rec,missed);return}
 const r={ts:Date.now(),mode:'timed',correct,total,answered,secs,full:!!s.test};
 if(total)(store.results[s.sub.id]=store.results[s.sub.id]||[]).push(r);save();
 if(s.test){s.test.records.push({id:s.sub.id,correct,total,secs,missed});s.test.k++;snd('open');s.test.k<s.test.order.length?sectionIntro(s.test):fullResults(s.test);return}
 snd('done');results(s,correct,total,secs,missed,true,answered)}
const missHTML=(q,a)=>{const opt=i=>i===null||i===undefined?'blank':L[i]+' ('+esc(strip(q.optText?q.optText[i]:q.options[i]))+')';
 return `<div class="miss"><div class="a">${subById(q.sid).name}</div><div class="q">${q.kind==='ic'?'Instruments showed: '+esc(q.truthText):q.stem}</div><div class="a">Yours: ${opt(a)} · Correct: ${opt(q.answer)}</div>${a!==null&&a!==undefined&&q.why&&q.why[a]?`<div><b>Where it went wrong:</b> ${q.why[a]}</div>`:''}<div>${q.explain}</div></div>`};
function results(s,correct,total,secs,missed,timed,answered){S=null;const id=s.sub.id;if(!total){page(`<div class="wrap"><button class="back" id="back">Home</button><div class="mast"><span class="eyebrow">${s.sub.name}</span><h1>Section complete</h1><p>This section has no right answers, so there is no score.</p></div></div>`);on('back',home,'back');return}const pct=Math.round(correct/total*100);
 page(`<div class="wrap"><button class="back" id="back">Home</button>
 <div class="mast"><span class="eyebrow">${timed?'Timed section':s.review?'Fixing mistakes':'Practice'} · results</span><h1>${pct>=95?'On target':pct>=85?'Close':'Keep drilling'}</h1></div>
 <div class="score"><span class="big num">${pct}%</span><span class="num">${correct} of ${total} right · ${clock(secs)} used${timed?` of ${clock(s.limit)} · ${answered} answered`:''} · ${total?Math.round(secs/total):0} s per question</span></div>
 <div class="row"><button class="btn primary" id="again">${timed?'Run another timed section':'Keep practising'}</button>${mistakeCount(id)?`<button class="btn" id="mist">Fix mistakes (${mistakeCount(id)})</button>`:''}</div>
 <div class="group"><h2>${missed.length?'Review what you missed':'Nothing missed'}</h2>${missed.slice(0,40).map(({q,a})=>missHTML(q,a)).join('')}</div></div>`);
 on('again',()=>start(id,timed?'timed':'practice'),'start');on('back',home,'back');on('mist',()=>start(id,'mistakes'),'start')}

/* ================= morning quick test ================= */
function dailyIntro(){const m=allMistakes().length;
 page(`<div class="wrap"><button class="back" id="back">Home</button><div class="mast"><span class="eyebrow">Morning quick test</span><h1>${DAILY_N} questions, ${DAILY_MIN} minutes</h1><p>One clock for the whole test. Questions from all six subtests are mixed together so you practise switching between them. Results and explanations come at the end.</p></div>
 <div class="tbl"><table><thead><tr><th>Subtest</th><th>Questions</th></tr></thead><tbody>${DAILY_PLAN.map(([id,n])=>`<tr><td>${subById(id).name}</td><td class="n">${n}</td></tr>`).join('')}</tbody></table></div>
 <div class="box"><span class="label">From your mistake list</span><p>${m?`Up to six questions come from the ${m} you’ve got wrong before, marked “From your mistake list”. Get one right and it moves toward leaving the list.`:'No saved mistakes yet. Once you miss a question anywhere in the app, it starts appearing here.'}</p></div>
 <div class="box"><span class="label">Rules</span><div class="row"><span class="chip no">No calculator</span><span class="chip yes">Whiteboard or paper for the maths</span><span class="chip">No guessing penalty</span></div><p>Tap an answer, then Next, like the real computer test. On a keyboard: A–E to answer, Enter for Next.</p></div>
 <div class="row"><button class="btn primary" id="go">Start</button></div></div>`);
 on('go',startDaily,'start');on('back',home,'back')}
function startDaily(){const S0={trCount:0,headOnly:!!store.headOnly,daily:true};const plan=Object.fromEntries(DAILY_PLAN);
 const picks=shuffle(allMistakes().filter(([sid,t])=>headOK(S0,t))).slice(0,6);const rest=[];
 for(const [sid,tag] of picks){const q=makeQ(subById(sid),S0,tag);q.review=true;rest.push(q);if(plan[sid]>1)plan[sid]--}
 const trBlock=[],bcBlock=[];for(const [sid,n] of Object.entries(plan))for(let k=0;k<n;k++){const q=makeQ(subById(sid),S0);(sid==='tr'?trBlock:sid==='bc'?bcBlock:rest).push(q)}
 const mixed=shuffle(rest);mixed.splice(rand(2,Math.floor(mixed.length/2)),0,...trBlock);mixed.splice(rand(Math.floor(mixed.length/2)+trBlock.length,mixed.length),0,...bcBlock);
 S={sub:{id:'daily',name:'Morning quick test',min:DAILY_MIN,n:mixed.length},daily:true,mode:'timed',i:0,qs:mixed,ans:new Array(mixed.length).fill(null),t0:Date.now(),qT0:Date.now(),limit:DAILY_MIN*60*(store.hard?0.85:1),warned:false};
 clearInterval(tick);tick=setInterval(updTimer,250);render()}
function dailyResults(rec,missed){const pct=pctOf(rec.correct,rec.total);
 const order=DAILY_PLAN.map(x=>x[0]).filter(id=>rec.parts[id]);
 const weakest=order.slice().sort((a,b)=>rec.parts[a].c/rec.parts[a].n-rec.parts[b].c/rec.parts[b].n)[0];
 page(`<div class="wrap"><button class="back" id="back">Home</button><div class="mast"><span class="eyebrow">Morning quick test · ${shortDate(rec.date)}</span><h1>${pct>=95?'Sharp this morning':pct>=85?'Solid start':'Worth a second look'}</h1></div>
 <div class="score"><span class="big num">${pct}%</span><span class="num">${rec.correct} of ${rec.total} right · ${clock(rec.secs)} used</span></div>
 ${rec.rv?`<p class="note">Questions from your mistake list: <b class="num">${rec.rvOk} of ${rec.rv}</b> right this time.</p>`:''}
 <div class="tbl"><table><thead><tr><th>Subtest</th><th>Score</th><th>%</th></tr></thead><tbody>${order.map(id=>{const p=rec.parts[id];return `<tr><td>${subById(id).name}</td><td class="n">${p.c}/${p.n}</td><td class="n">${pctOf(p.c,p.n)}%</td></tr>`}).join('')}</tbody></table></div>
 <div class="row"><button class="btn primary" id="weak">Practise ${subById(weakest).name}</button></div>
 <div class="group"><h2>${missed.length?'Review what you missed':'Nothing missed'}</h2>${missed.map(({q,a})=>missHTML(q,a)).join('')}</div></div>`);
 on('weak',()=>start(weakest,'practice'),'start');on('back',home,'back')}

/* ================= full test ================= */
function fullIntro(){const mins=FULL_ORDER.reduce((a,id)=>a+subById(id).min,0);
 page(`<div class="wrap"><button class="back" id="back">Home</button><div class="mast"><span class="eyebrow">Full test simulation</span><h1>Before you start</h1></div>
 <div class="lesson"><p>This runs the built subtests in the real Form T order, each with its real question count and time limit.</p>
 <div class="tbl"><table><thead><tr><th>#</th><th>Subtest</th><th>Questions</th><th>Minutes</th><th>Working</th></tr></thead><tbody>${FULL_ORDER.map((id,i)=>{const s=subById(id);return `<tr><td class="n">${i+1}</td><td>${s.name}</td><td class="n">${s.n}</td><td class="n">${s.min}</td><td>${id==='ar'||id==='mk'?'Whiteboard':'None'}</td></tr>`}).join('')}</tbody></table></div>
 <div class="box"><span class="label">Test-day rules</span>${RULES_COMMON}<p>As on the computer test: tap an answer, then Next. You can go back within a subtest in this simulation. A ten-minute break is offered after Math Knowledge.</p></div>
 <p class="note">About ${mins} minutes of testing. Somewhere quiet, Do Not Disturb on, a pen and paper (or a small whiteboard), and no calculator.</p></div>
 <div class="row"><button class="btn primary" id="go">Begin</button></div></div>`);
 on('go',()=>sectionIntro({order:FULL_ORDER.slice(),k:0,records:[]}),'start');on('back',home,'back')}
function sectionIntro(test){const id=test.order[test.k];const s=subById(id);
 if(test.k>0&&['ps'].includes(id)&&!test.breakDone){breakScreen(test);return}
 page(`<div class="wrap"><div class="mast"><span class="eyebrow">${test.k<test.order.indexOf('ps')?'Part A':'Part B'} · section ${test.k+1} of ${test.order.length}</span><h1>${s.name}</h1></div>${test.k===0?`<div class="box"><span class="label">The whole test</span><p>${test.order.map(i=>subById(i).name).join(' → ')}. Each subtest has its own clock, you can’t go back to an earlier one, and there is a ten-minute break before Part B. Have a whiteboard or paper ready; no calculator.</p></div>`:''}
 <div class="tile"><div class="secinfo"><div><span class="label">Questions</span><div class="big num">${s.n}</div></div><div><span class="label">Time</span><div class="big num">${s.min} min</div></div><div><span class="label">Per question</span><div class="big num">~${Math.round(s.min*60/s.n)} s</div></div></div></div>
 <div class="lesson"><p>${SECTION_NOTE[id]}</p><div class="box"><span class="label">Rules for this section</span><div class="row">${chipsHTML(id)}</div><p>${RULES[id].note}</p></div></div>
 <div class="row"><button class="btn primary" id="go">Start section</button><button class="btn ghost" id="q">Quit test</button></div></div>`);
 on('go',()=>start(id,'timed',test),'start');on('q',home,'back')}
function breakScreen(test){let left=600;
 page(`<div class="wrap"><div class="mast"><span class="eyebrow">Break</span><h1>Break before Part B</h1><p>Part A is done. Stand up, drink some water. Part B starts with Physical Science when you are ready.</p></div>
 <div class="score"><span class="big num" id="bt">10:00</span></div><div class="row"><button class="btn primary" id="go">Continue now</button></div></div>`);
 tick=setInterval(()=>{left--;const el=document.getElementById('bt');if(el)el.textContent=clock(left);if(left<=0){clearInterval(tick);snd('warn');test.breakDone=true;sectionIntro(test)}},1000);
 on('go',()=>{clearInterval(tick);test.breakDone=true;sectionIntro(test)})}
function fullResults(test){snd('done');const recs=test.records;const correct=recs.reduce((a,r)=>a+r.correct,0),total=recs.reduce((a,r)=>a+r.total,0);
 const pilot=recs.filter(r=>subById(r.id).group==='pilot');const scoredRecs=recs.filter(r=>r.total);const pPct=Math.round(pilot.reduce((a,r)=>a+r.correct,0)/pilot.reduce((a,r)=>a+r.total,0)*100);
 store.full.push({ts:Date.now(),correct,total,pilotPct:pPct,parts:recs.map(r=>({id:r.id,correct:r.correct,total:r.total,secs:r.secs}))});save();
 page(`<div class="wrap"><button class="back" id="back">Home</button><div class="mast"><span class="eyebrow">Full test simulation · results</span><h1>${pPct>=95?'Pilot subtests on target':pPct>=85?'Close to target':'Keep building'}</h1></div>
 <div class="score"><span class="big num">${pPct}%</span><span class="num">right across the five Pilot subtests · ${Math.round(correct/total*100)}% across all ${scoredRecs.length} scored sections</span></div>
 <div class="tbl"><table><thead><tr><th>Subtest</th><th>Score</th><th>%</th><th>Time used</th></tr></thead><tbody>${recs.map(r=>`<tr><td>${subById(r.id).name}</td><td class="n">${r.total?r.correct+'/'+r.total:'—'}</td><td class="n">${r.total?Math.round(r.correct/r.total*100)+'%':'not scored'}</td><td class="n">${clock(r.secs)} / ${clock(subById(r.id).min*60)}</td></tr>`).join('')}</tbody></table></div>
 <p class="note">These are raw scores. Real AFOQT scores are percentiles against other candidates, so treat 95%+ raw on every Pilot subtest as the goal.</p>
 <div class="group"><h2>Review by section</h2>${scoredRecs.map(r=>`<details class="sect"><summary>${subById(r.id).name}: ${r.missed.length} missed</summary>${r.missed.slice(0,40).map(({q,a})=>missHTML(q,a)).join('')||'<p class="note">Nothing missed.</p>'}</details>`).join('')}</div></div>`);
 on('back',home,'back')}

home();
</script>
